<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* =====================================================
   CORE_PLACEHOLDER — Renderer + Substanz-Katalog
   ===================================================== */
"use strict";

/* ============================================================
   1. STRUKTUR-DATENMODELL
   { atoms: [{e, x, y, lp, charge?, hidden?}],
     bonds: [{a, b, o}],
     name, formula }
   y wächst nach unten (SVG); Bindungslänge = 1 Einheit.
   ============================================================ */

const SIN60 = Math.sin(Math.PI/3);   // 0.866
const COS60 = Math.cos(Math.PI/3);   // 0.5

/* ---------- Atom-Generatoren (für Reine Elemente) ---------- */
function singleAtom(symbol, valence, name, formula) {
  // Konventionelle Lewis-Punktschreibweise für ein freies Atom:
  // erst je 1 Elektron auf jede der 4 Seiten (Hund), dann auffüllen.
  // → Einsame Paare = max(0, Valenz − 4), ungepaarte = Valenz − 2·Paare.
  const lp = Math.max(0, valence - 4);
  const unpaired = valence - 2*lp;   // 0..4
  return {
    atoms:[{e:symbol, x:0, y:0, lp: lp, unpaired: unpaired}],
    bonds:[],
    name, formula
  };
}

/* ---------- Diatomare Moleküle ---------- */
function diat(e1, lp1, e2, lp2, order, name, formula) {
  return {
    atoms:[{e:e1, x:-0.6, y:0, lp:lp1}, {e:e2, x:0.6, y:0, lp:lp2}],
    bonds:[{a:0, b:1, o:order}],
    name, formula
  };
}

/* ---------- Wasser u.ä. (gewinkelt) ---------- */
function bentXH2(centralE, lp_central, name, formula) {
  // X mit 2 H, gewinkelt (120°-Schul-Approximation für 104.5°)
  // Hs nach unten geöffnet, LPs nach oben
  return {
    atoms: [
      {e:centralE, x:0, y:0, lp:lp_central},
      {e:"H", x:-SIN60, y:COS60, lp:0},
      {e:"H", x:SIN60,  y:COS60, lp:0}
    ],
    bonds: [{a:0,b:1,o:1},{a:0,b:2,o:1}],
    name, formula
  };
}

/* ---------- Ammoniak (pyramidal-Andeutung als 90°-Kreuz mit LP oben) ---------- */
function nh3() {
  return {
    atoms:[
      {e:"N", x:0, y:0, lp:1},
      {e:"H", x:-1, y:0, lp:0},
      {e:"H", x:1, y:0, lp:0},
      {e:"H", x:0, y:1, lp:0}
    ],
    bonds:[{a:0,b:1,o:1},{a:0,b:2,o:1},{a:0,b:3,o:1}],
    name:"Ammoniak", formula:"NH₃"
  };
}

/* ---------- Methan, Tetraeder als Kreuz ---------- */
function methaneStruct() {
  return {
    atoms:[
      {e:"C", x:0, y:0, lp:0},
      {e:"H", x:0, y:-1, lp:0},
      {e:"H", x:1, y:0, lp:0},
      {e:"H", x:0, y:1, lp:0},
      {e:"H", x:-1, y:0, lp:0}
    ],
    bonds:[{a:0,b:1,o:1},{a:0,b:2,o:1},{a:0,b:3,o:1},{a:0,b:4,o:1}],
    name:"Methan", formula:"CH₄"
  };
}

/* ---------- Linear (CO2, Acetylen, ...) ---------- */
function co2Struct() {
  return {
    atoms:[
      {e:"O", x:-1.2, y:0, lp:2},
      {e:"C", x:0, y:0, lp:0},
      {e:"O", x:1.2, y:0, lp:2}
    ],
    bonds:[{a:0,b:1,o:2},{a:1,b:2,o:2}],
    name:"Kohlenstoffdioxid", formula:"CO₂"
  };
}

/* ============================================================
   2. ALKAN-FAMILIE: volle Lewis-Form (linear, Hs oben/unten)
   ============================================================ */
function nAlkaneFull(n, name) {
  if (n < 1) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  for (let i=0; i<n; i++) {
    atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
    atoms.push({e:"H", x:i, y:1, lp:0});  bonds.push({a:i, b:atoms.length-1, o:1});
    if (i===0)   { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
    if (i===n-1) { atoms.push({e:"H", x:n,  y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
  }
  return {atoms, bonds, name, formula: alkaneFormula(n)};
}
function alkaneFormula(n) { return "C"+(n===1?"":sub(n))+"H"+sub(2*n+2); }

/* ============================================================
   3. ALKAN: Skelett (Zickzack)
   ============================================================ */
function nAlkaneSkeletal(n, name) {
  if (n < 3) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) {
    atoms.push({e:"C", x: i*SIN60, y: (i%2===0 ? 0 : COS60), lp:0, hidden:true});
  }
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  return {atoms, bonds, name, formula: alkaneFormula(n)};
}

/* ============================================================
   4. ALKANOLE
   ============================================================ */
function nAlkanolFull(n, pos, name) {
  // n: Kettenlänge, pos: 1..n, OH ersetzt H an C_pos (genauer: das untere H wird zu O)
  const base = nAlkaneFull(n, "");
  const cIdx = pos - 1;
  // Suche das H bei (cIdx, +1)
  let killIdx = -1;
  for (let i=n; i<base.atoms.length; i++) {
    if (base.atoms[i].e === "H" && base.atoms[i].x === cIdx && base.atoms[i].y === 1) {
      killIdx = i; break;
    }
  }
  if (killIdx < 0) {
    for (let i=n; i<base.atoms.length; i++) {
      if (base.atoms[i].e === "H" && base.atoms[i].x === cIdx) { killIdx = i; break; }
    }
  }
  base.bonds = base.bonds.filter(b => b.a !== killIdx && b.b !== killIdx);
  base.atoms[killIdx] = {e:"O", x:cIdx, y:1, lp:2};
  base.bonds.push({a:cIdx, b:killIdx, o:1});
  // H am O linear in Verlängerung der C-O-Achse (gerade nach unten),
  // damit die OH-Gruppe linear absteht; die 2 LPs liegen dann links/rechts
  base.atoms.push({e:"H", x:cIdx, y:2, lp:0});
  base.bonds.push({a:killIdx, b:base.atoms.length-1, o:1});
  base.name = name;
  base.formula = "C"+(n===1?"":sub(n))+"H"+sub(2*n+2)+"O";
  return base;
}

function nAlkanolSkeletal(n, pos, name) {
  // Ab n=1 verfügbar (wie Alkanale/Alkansäuren); n<3 ohne nAlkaneSkeletal (liefert dort null).
  if (n < 1) return null;
  const sk = n >= 3 ? nAlkaneSkeletal(n, name) : {
    atoms: Array.from({length:n}, (_, i) => ({e:"C", x: i*SIN60, y: (i%2===0 ? 0 : COS60), lp:0, hidden:true})),
    bonds: n === 2 ? [{a:0, b:1, o:1}] : [], name
  };
  const cIdx = pos - 1;
  const cAt = sk.atoms[cIdx];
  // Zickzack-Konvention:
  //   gerade Indizes (cIdx%2===0): "Tal", y=0 — Außenseite ist OBEN (-y)
  //   ungerade Indizes:           "Spitze", y=COS60 — Außenseite ist UNTEN (+y)
  const dy = (cIdx % 2 === 0) ? -1 : +1;
  const oxN = sk.atoms.length;
  sk.atoms.push({e:"O", x: cAt.x, y: cAt.y + dy, lp:2});
  sk.bonds.push({a: cIdx, b: oxN, o:1});
  // H am O: gewinkelt nach außen, im 120°-Winkel zur C-O-Achse
  sk.atoms.push({e:"H", x: cAt.x + SIN60, y: cAt.y + dy + dy*COS60, lp:0});
  sk.bonds.push({a: oxN, b: sk.atoms.length-1, o:1});
  sk.name = name;
  sk.formula = "C"+(n===1?"":sub(n))+"H"+sub(2*n+2)+"O";
  return sk;
}

/* ============================================================
   5. ALKANSÄUREN
   ============================================================ */
function nAcidFull(n, name) {
  // CH3-(CH2)_{n-2}-COOH; bei n=1: HCOOH
  if (n < 1) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  // Hs an C0..C_{n-2} (sp³)
  for (let i=0; i<n-1; i++) {
    atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
    atoms.push({e:"H", x:i, y:1, lp:0});  bonds.push({a:i, b:atoms.length-1, o:1});
    if (i===0) { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
  }
  // COOH am letzten C (sp²)
  const cc = n-1;
  // =O oben-rechts (60° vom C aus)
  const iOdb = atoms.length;
  atoms.push({e:"O", x: cc + COS60, y: -SIN60, lp:2});
  bonds.push({a:cc, b:iOdb, o:2});
  // -O unten-rechts
  const iOH = atoms.length;
  atoms.push({e:"O", x: cc + COS60, y: SIN60, lp:2});
  bonds.push({a:cc, b:iOH, o:1});
  // H an OH — linear in Verlängerung der C–O-Achse (wie bei Alkanolen),
  // damit die OH-Gruppe gerade absteht und die LPs senkrecht liegen.
  atoms.push({e:"H", x: cc + 2*COS60, y: 2*SIN60, lp:0});
  bonds.push({a:iOH, b:atoms.length-1, o:1});
  if (n===1) {
    // HCOOH: zusätzliches H links am Carbonyl-C
    atoms.push({e:"H", x:-1, y:0, lp:0});
    bonds.push({a:0, b:atoms.length-1, o:1});
  }
  return {atoms, bonds, name, formula: acidFormula(n)};
}
function acidFormula(n) {
  return "C"+(n===1?"":sub(n))+"H"+sub(2*n)+"O₂";
}

function nAcidSkeletal(n, name) {
  // Carboxyl-C ist Teil der Zickzack-Kette; =O und -O-H beide im 120°-Winkel.
  // Für alle Kettenlängen ab n=1 (Methansäure) verfügbar.
  if (n < 1) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) {
    atoms.push({e:"C", x: i*SIN60, y: (i%2===0 ? 0 : COS60), lp:0, hidden:true});
  }
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  const last = atoms[n-1];
  let base;
  if (n >= 2) {
    const prev = atoms[n-2];
    base = Math.atan2(last.y - prev.y, last.x - prev.x);  // Richtung der eingehenden Bindung
  } else {
    base = 0;   // n=1 (Methansäure): so behandeln, als käme die Kette von links
  }
  // Zwei freie Richtungen am Carbonyl-C: jeweils 60° von der "Verlängerung" base abgewinkelt
  const angA = base + Math.PI/3;
  const angB = base - Math.PI/3;
  // Wähle =O oben (kleineres y = kleineres sin, da y wächst nach unten)
  let dbAng, ohAng;
  if (Math.sin(angA) < Math.sin(angB)) { dbAng = angA; ohAng = angB; }
  else { dbAng = angB; ohAng = angA; }
  const oDb = atoms.length;
  atoms.push({e:"O", x: last.x + Math.cos(dbAng), y: last.y + Math.sin(dbAng), lp:2});
  bonds.push({a: n-1, b: oDb, o:2});
  const oH = atoms.length;
  atoms.push({e:"O", x: last.x + Math.cos(ohAng), y: last.y + Math.sin(ohAng), lp:2});
  bonds.push({a: n-1, b: oH, o:1});
  // H am O linear in Verlängerung der C–O-Achse (wie bei Alkanolen)
  const oxAt = atoms[oH];
  atoms.push({e:"H", x: oxAt.x + Math.cos(ohAng), y: oxAt.y + Math.sin(ohAng), lp:0});
  bonds.push({a: oH, b: atoms.length-1, o:1});
  if (n === 1) {
    // Ameisensäure: das Formyl-H am Carboxyl-C explizit zeichnen
    atoms.push({e:"H", x: atoms[0].x - 1, y: atoms[0].y, lp:0});
    bonds.push({a: 0, b: atoms.length-1, o:1});
  }
  return {atoms, bonds, name, formula: acidFormula(n)};
}

/* ============================================================
   6. ALKANALE
   ============================================================ */
function nAldehydeFull(n, name) {
  if (n < 1) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  for (let i=0; i<n-1; i++) {
    atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
    atoms.push({e:"H", x:i, y:1, lp:0});  bonds.push({a:i, b:atoms.length-1, o:1});
    if (i===0) { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
  }
  const cc = n-1;
  atoms.push({e:"O", x: cc + COS60, y: -SIN60, lp:2});
  bonds.push({a:cc, b:atoms.length-1, o:2});
  atoms.push({e:"H", x: cc + COS60, y: SIN60, lp:0});
  bonds.push({a:cc, b:atoms.length-1, o:1});
  if (n===1) {
    atoms.push({e:"H", x:-1, y:0, lp:0});
    bonds.push({a:0, b:atoms.length-1, o:1});
  }
  return {atoms, bonds, name, formula: aldehydeFormula(n)};
}
function aldehydeFormula(n) {
  return "C"+(n===1?"":sub(n))+"H"+sub(2*n)+"O";
}
function nAldehydeSkeletal(n, name) {
  // Verfügbar ab n=1 (Methanal). Carbonyl am Kettenende, Aldehyd-H gegenüber =O.
  if (n < 1) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) {
    atoms.push({e:"C", x: i*SIN60, y: (i%2===0 ? 0 : COS60), lp:0, hidden:true});
  }
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  const lastIdx = n - 1;
  const last = atoms[lastIdx];
  if (n === 1) {
    // Methanal: kein Vorgänger-C, also keine Kettenrichtung zum Anwinkeln -
    // symmetrische Konstruktion, ergibt bereits exakt 120°/120°/120°.
    const dy = -1;
    atoms.push({e:"O", x: last.x + COS60, y: last.y + dy*SIN60, lp:2});
    bonds.push({a: lastIdx, b: atoms.length-1, o:2});
    atoms.push({e:"H", x: last.x + COS60, y: last.y - dy*SIN60, lp:0});
    bonds.push({a: lastIdx, b: atoms.length-1, o:1});
    atoms.push({e:"H", x: last.x - 1, y: last.y, lp:0});
    bonds.push({a: lastIdx, b: atoms.length-1, o:1});
    return {atoms, bonds, name, formula: aldehydeFormula(n)};
  }
  // n≥2: echte sp²-Geometrie am Carbonyl-C. =O und Aldehyd-H stehen beide im
  // 120°-Winkel zur ankommenden C–C-Bindung UND zueinander - durch Drehen der
  // "zurück zur Kette"-Richtung um ±120° (die alte Verschiebung um feste
  // (COS60, ±SIN60) ergab real 150° statt 120°, s. Analyse/Screenshot).
  const prev = atoms[lastIdx-1];
  const backx = -(last.x - prev.x), backy = -(last.y - prev.y);
  const cos120 = -0.5, sin120 = SIN60;
  const d1 = { x: backx*cos120 - backy*sin120, y: backx*sin120 + backy*cos120 };
  const d2 = { x: backx*cos120 + backy*sin120, y: -backx*sin120 + backy*cos120 };
  // Außenseite-Konvention beibehalten: an einem "Gipfel" (gerader Index) zeigt
  // =O nach oben, an einem "Tal" (ungerader Index) nach unten.
  const oDir = (lastIdx % 2 === 0) ? d1 : d2;
  const hDir = (lastIdx % 2 === 0) ? d2 : d1;
  atoms.push({e:"O", x: last.x + oDir.x, y: last.y + oDir.y, lp:2});
  bonds.push({a: lastIdx, b: atoms.length-1, o:2});
  atoms.push({e:"H", x: last.x + hDir.x, y: last.y + hDir.y, lp:0});
  bonds.push({a: lastIdx, b: atoms.length-1, o:1});
  return {atoms, bonds, name, formula: aldehydeFormula(n)};
}

/* ============================================================
   7. ALKANONE  (R-CO-R')
   ============================================================ */
function nKetoneFull(n, pos, name) {
  // n: Kettenlänge, pos: Position des Carbonyl-C (1-basiert, intern → 2..n-1)
  if (n < 3 || pos < 2 || pos > n-1) return null;
  const atoms = [], bonds = [];
  for (let i=0; i<n; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<n-1; i++) bonds.push({a:i, b:i+1, o:1});
  // Hs (sp³ an Cs ≠ Carbonyl-C)
  const cc = pos - 1;  // 0-basierter Index des Carbonyl-Cs
  for (let i=0; i<n; i++) {
    if (i === cc) continue;
    atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
    atoms.push({e:"H", x:i, y:1, lp:0});  bonds.push({a:i, b:atoms.length-1, o:1});
    if (i===0)   { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
    if (i===n-1) { atoms.push({e:"H", x:n,  y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
  }
  // Carbonyl-O am cc, oben
  atoms.push({e:"O", x:cc, y:-1, lp:2});
  bonds.push({a:cc, b:atoms.length-1, o:2});
  return {atoms, bonds, name, formula: ketoneFormula(n)};
}
function ketoneFormula(n) { return "C"+sub(n)+"H"+sub(2*n)+"O"; }

function nKetoneSkeletal(n, pos, name) {
  if (n < 3) return null;
  const sk = nAlkaneSkeletal(n, name);
  const cc = pos - 1;
  // =O am cc, senkrecht zur Kettenmitte: nach oben (kleineres y)
  const cAt = sk.atoms[cc];
  // Carbonyl-O auf der dem Rückgrat abgewandten (symmetrischen) Außenseite:
  //   gerade Index (Peak, y=0)        → nach oben (−1)
  //   ungerader Index (Tal, y=COS60)  → nach unten (+1)
  // Dadurch zeigt Pentan-3-on (cc=2) nach oben, die 2-one weiter nach unten.
  const dy = (cc % 2 === 0) ? -1 : +1;
  sk.atoms.push({e:"O", x: cAt.x, y: cAt.y + dy, lp:2});
  sk.bonds.push({a: cc, b: sk.atoms.length-1, o:2});
  sk.name = name;
  sk.formula = ketoneFormula(n);
  return sk;
}

/* ============================================================
   8. ALKENE  &  ALKINE
   ============================================================ */
function nAlkeneFull(n, pos, name) {
  // pos: Position der Doppelbindung (zwischen Cs an Index pos-1 und pos)
  if (n < 2 || pos < 1 || pos > n-1) return null;
  const dbA = pos - 1, dbB = pos;
  const atoms = [], bonds = [];
  // C-Backbone: dbA und dbB sind sp², die anderen sp³.
  // Wir bauen einen Zickzack, bei dem die Doppelbindung horizontal liegt:
  // Schritt: jedes C bekommt eine x-Position um Bindungslänge 1 versetzt.
  // sp²-C (dbA, dbB) liegen auf y=0; ihre weiteren Bindungen sind 120°.
  // Wir setzen alle Cs zickzackförmig: Index i bei x = i*SIN60 (also Bindungslänge 1).
  // y-Wert: die Doppelbindung liegt auf y=0; benachbarte sp³-Cs zickzacken nach oben/unten.
  // Vereinfachung: alle Cs auf y=0, alle CC-Bindungen Länge 1 (horizontal äquidistant).
  for (let i=0; i<n; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<n-1; i++) {
    bonds.push({a:i, b:i+1, o: (i===dbA ? 2 : 1)});
  }
  // Hs
  for (let i=0; i<n; i++) {
    const isLeft = (i===0), isRight = (i===n-1);
    const isSp2 = (i===dbA || i===dbB);
    if (isSp2) {
      // sp²: Anzahl der Hs = 4 - (Σ Bindungsordnungen zu Nachbar-Cs)
      // dbA/dbB haben jeweils Doppelbindung (=2) zueinander; falls terminal, sonst 1 weitere
      // Einfachbindung zum nächsten C. Also Hs:
      //   terminal & sp²: 4 - 2 = 2 Hs (CH₂=)
      //   intern  & sp²: 4 - 2 - 1 = 1 H
      const isTerminal = (i===dbA && isLeft) || (i===dbB && isRight);
      if (isTerminal) {
        // terminales =CH2: zwei Hs schräg nach außen (oben/unten)
        const dx = (i===dbA) ? -COS60 : +COS60;
        atoms.push({e:"H", x: i + dx, y: -SIN60, lp:0});
        bonds.push({a:i, b: atoms.length-1, o:1});
        atoms.push({e:"H", x: i + dx, y:  SIN60, lp:0});
        bonds.push({a:i, b: atoms.length-1, o:1});
      } else {
        // internes sp²-C (=CH−): das eine H steht rechtwinklig zu den beiden
        // (kollinearen, horizontalen) C–C-Bindungen, also senkrecht nach oben.
        atoms.push({e:"H", x: i, y: -1, lp:0});
        bonds.push({a:i, b: atoms.length-1, o:1});
      }
    } else {
      // sp³: terminal-C bekommt 3 Hs, intern 2 Hs
      atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
      atoms.push({e:"H", x:i, y: 1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
      if (isLeft)  { atoms.push({e:"H", x:i-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
      if (isRight) { atoms.push({e:"H", x:i+1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
    }
  }
  return {atoms, bonds, name, formula: "C"+(n===1?"":sub(n))+"H"+sub(2*n)};
}

function nAlkeneSkeletal(n, pos, name) {
  if (n < 4) return null; // unter 4 Cs zu kurz für Skelett-Mehrwert
  const sk = nAlkaneSkeletal(n, name);
  // Bindung pos-1 → pos zur Doppelbindung machen
  for (const b of sk.bonds) {
    if ((b.a === pos-1 && b.b === pos) || (b.a === pos && b.b === pos-1)) {
      b.o = 2; break;
    }
  }
  sk.formula = "C"+(n===1?"":sub(n))+"H"+sub(2*n);
  return sk;
}

function nAlkyneFull(n, pos, name) {
  if (n < 2 || pos < 1 || pos > n-1) return null;
  const dbA = pos - 1, dbB = pos;
  const atoms = [], bonds = [];
  // Bei sp ist es linear; alle Cs auf y=0
  for (let i=0; i<n; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<n-1; i++) {
    bonds.push({a:i, b:i+1, o: (i===dbA ? 3 : 1)});
  }
  for (let i=0; i<n; i++) {
    const isLeft = (i===0), isRight = (i===n-1);
    const isSp = (i===dbA || i===dbB);
    if (isSp) {
      // sp: nur 1 H/Bindung. Wenn terminal: H außen.
      if (i===dbA && isLeft)  { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
      if (i===dbB && isRight) { atoms.push({e:"H", x:n,  y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
    } else {
      // sp³
      atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
      atoms.push({e:"H", x:i, y:1, lp:0});  bonds.push({a:i, b:atoms.length-1, o:1});
      if (isLeft)  { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
      if (isRight) { atoms.push({e:"H", x:n,  y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
    }
  }
  return {atoms, bonds, name, formula: "C"+(n===1?"":sub(n))+"H"+sub(2*n-2)};
}

function nAlkyneSkeletal(n, pos, name) {
  if (n < 4) return null;
  // Skelett mit linearem C≡C-Segment.
  // Wir bauen die Kette Schritt für Schritt mit Richtungsvektoren.
  // Normale Bindung: Zickzack (Winkel ±30° zur Horizontalen).
  // Um eine Dreifachbindung (zwischen pos-1 und pos): das Segment davor, die
  // Dreifachbindung selbst und das Segment danach sind kollinear (horizontal).
  const atoms = [], bonds = [];
  let x = 0, y = 0;
  atoms.push({e:"C", x, y, lp:0, hidden:true});
  // Richtung: Zickzack startet nach rechts-unten (+30°) / rechts-oben (-30°)
  let dirUp = true; // nächstes Segment geht nach oben?
  for (let i = 1; i < n; i++) {
    const bondIdxA = i-1, bondIdxB = i;
    const isTripleBond = (bondIdxA === pos-1 && bondIdxB === pos);
    const prevWasTriple = (i-1 === pos);     // Segment direkt nach der Dreifachb.
    const nextIsTriple = (i === pos-1);      // Segment direkt vor der Dreifachb.
    let dx, dy;
    if (isTripleBond || prevWasTriple || nextIsTriple) {
      // linear (horizontal)
      dx = 1; dy = 0;
    } else {
      // Zickzack
      dx = SIN60;
      dy = dirUp ? -COS60 : COS60;
      dirUp = !dirUp;
    }
    x += dx; y += dy;
    atoms.push({e:"C", x, y, lp:0, hidden:true});
    bonds.push({a: bondIdxA, b: bondIdxB, o: isTripleBond ? 3 : 1});
  }
  return {atoms, bonds, name, formula: "C"+(n===1?"":sub(n))+"H"+sub(2*n-2)};
}

/* ============================================================
   9. ESTER  R-CO-O-R'
   nA = Säurekettenlänge incl. Carbonyl-C
   nB = Alkohol-Rest-Länge
   ============================================================ */
function esterFull(nA, nB, name) {
  if (nA < 1 || nB < 1) return null;
  const atoms = [], bonds = [];
  // R-Kette nA Cs (links): C0..C_{nA-1}, letztes ist Carbonyl-C
  for (let i=0; i<nA; i++) atoms.push({e:"C", x:i, y:0, lp:0});
  for (let i=0; i<nA-1; i++) bonds.push({a:i, b:i+1, o:1});
  // Alkyl-Hs an C0..C_{nA-2}
  for (let i=0; i<nA-1; i++) {
    atoms.push({e:"H", x:i, y:-1, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1});
    atoms.push({e:"H", x:i, y:1, lp:0});  bonds.push({a:i, b:atoms.length-1, o:1});
    if (i===0) { atoms.push({e:"H", x:-1, y:0, lp:0}); bonds.push({a:i, b:atoms.length-1, o:1}); }
  }
  if (nA === 1) {
    // Methansäureester: H an Carbonyl-C
    atoms.push({e:"H", x:-1, y:0, lp:0});
    bonds.push({a:0, b:atoms.length-1, o:1});
  }
  const cc = nA - 1;
  // =O senkrecht nach oben vom Carbonyl-C (rechtwinklig, wie bei Alkanonen),
  // damit keine gestauchten Winkel entstehen.
  const iOdb = atoms.length;
  atoms.push({e:"O", x: cc, y: -1, lp:2});
  bonds.push({a:cc, b:iOdb, o:2});
  // -O- nach rechts
  const iOe = atoms.length;
  atoms.push({e:"O", x: cc + 1, y: 0, lp:2});
  bonds.push({a:cc, b:iOe, o:1});
  // R'-Kette nB Cs nach rechts vom Ether-O
  const offsetX = cc + 2;
  const cRStart = atoms.length;
  for (let j=0; j<nB; j++) atoms.push({e:"C", x: offsetX + j, y:0, lp:0});
  bonds.push({a:iOe, b:cRStart, o:1});
  for (let j=0; j<nB-1; j++) bonds.push({a:cRStart+j, b:cRStart+j+1, o:1});
  // Hs an C R'-Kette
  for (let j=0; j<nB; j++) {
    const idx = cRStart + j;
    atoms.push({e:"H", x: offsetX + j, y:-1, lp:0}); bonds.push({a:idx, b:atoms.length-1, o:1});
    atoms.push({e:"H", x: offsetX + j, y:1, lp:0});  bonds.push({a:idx, b:atoms.length-1, o:1});
    if (j===nB-1) { atoms.push({e:"H", x: offsetX + j + 1, y:0, lp:0}); bonds.push({a:idx, b:atoms.length-1, o:1}); }
  }
  // Formel: C_{nA+nB} H_{2(nA+nB)} O₂
  const totalC = nA + nB;
  const totalH = 2*nA + 2*nB;
  return {atoms, bonds, name, formula: "C"+sub(totalC)+"H"+sub(totalH)+"O₂"};
}

function esterSkeletal(nA, nB, name) {
  // Skelett für alle Ester verfügbar (auch Methylformiat, nA=nB=1).
  if (nA < 1 || nB < 1) return null;
  const atoms = [], bonds = [];
  // Zickzack der R-Kette (links)
  for (let i=0; i<nA; i++) {
    atoms.push({e:"C", x: i*SIN60, y: (i%2===0 ? 0 : COS60), lp:0, hidden:true});
  }
  for (let i=0; i<nA-1; i++) bonds.push({a:i, b:i+1, o:1});
  const ccIdx = nA - 1;
  const ccAt = atoms[ccIdx];
  // =O am Carbonyl-C auf der symmetrischen Außenseite (Parität wie bei Ketonen):
  //   gerade Index → oben (−1), ungerader Index → unten (+1).
  //   So werden Methyl-/Ethylacetat gespiegelt, Formiate bleiben oben.
  const dyO = (ccIdx % 2 === 0) ? -1 : +1;
  atoms.push({e:"O", x: ccAt.x, y: ccAt.y + dyO, lp:2});
  bonds.push({a: ccIdx, b: atoms.length-1, o:2});
  // -O- in Kettenfortsetzung (zickzack)
  const oeAt = {e:"O", x: ccAt.x + SIN60, y: (nA % 2 === 0) ? 0 : COS60, lp:2};
  // einfach nächste Zickzack-Position:
  const nextY = (nA % 2 === 0) ? 0 : COS60;
  oeAt.y = nextY;
  oeAt.x = nA * SIN60;
  const oeIdx = atoms.length;
  atoms.push(oeAt);
  bonds.push({a: ccIdx, b: oeIdx, o:1});
  // R'-Kette
  for (let j=0; j<nB; j++) {
    const totalI = nA + 1 + j; // gesamtindex in zickzack
    atoms.push({e:"C", x: totalI * SIN60, y: (totalI % 2 === 0) ? 0 : COS60, lp:0, hidden:true});
    bonds.push({a: (j===0 ? oeIdx : atoms.length-2), b: atoms.length-1, o:1});
  }
  const totalC = nA + nB;
  const totalH = 2*nA + 2*nB;
  if (nA === 1) {
    // Formiate (Methyl-/Ethylformiat): Formyl-H am Carboxyl-C zeichnen —
    // links unten, damit H–C=O, H–C–O und O=C–O alle 120° haben (=O bei −90°, –O– bei +30°)
    atoms.push({e:"H", x: ccAt.x - SIN60, y: ccAt.y + COS60, lp:0});
    bonds.push({a: ccIdx, b: atoms.length-1, o:1});
  }
  return {atoms, bonds, name, formula: "C"+sub(totalC)+"H"+sub(totalH)+"O₂"};
}

/* ============================================================
   10. SPEZIAL-STRUKTUREN (anorg./aromatisch)
   Alle Bindungslängen = 1; geometrische Hilfsmittel:
   - 120° Spreizung um eine Achse:  (±SIN60, ±COS60)
   - 90°-Kreuz:                     (±1, 0), (0, ±1)
   - linear:                        (±1, 0)
   ============================================================ */
function ozoneStruct() {
  // O=O+-O-  gewinkelt (120°), mittleres O sp²
  return {
    atoms:[
      {e:"O", x:-SIN60, y:COS60, lp:2},                    // =O links-unten
      {e:"O", x:0, y:0, lp:1, charge:"+"},                  // O+ Spitze
      {e:"O", x:SIN60,  y:COS60, lp:3, charge:"−"}         // -O- rechts-unten
    ],
    bonds:[{a:0,b:1,o:2},{a:1,b:2,o:1}],
    name:"Ozon", formula:"O₃"
  };
}
function so2Struct() {
  return {
    atoms:[
      {e:"S", x:0, y:0, lp:1},
      {e:"O", x:-SIN60, y:COS60, lp:2},
      {e:"O", x:SIN60,  y:COS60, lp:2}
    ],
    bonds:[{a:0,b:1,o:2},{a:0,b:2,o:2}],
    name:"Schwefeldioxid", formula:"SO₂"
  };
}
function so3Struct() {
  // Oktett-konforme Resonanzform: S²⁺ mit 1 Doppelbindung (=O) und 2 Einfachbindungen (−O⁻)
  // S: 4 Bindungen = Oktett, Formalladung +2; =O neutral (2 LP); 2× −O⁻ (3 LP)
  return {
    atoms:[
      {e:"S", x:0, y:0, lp:0, charge:"2+"},
      {e:"O", x:0, y:-1, lp:2},                       // =O oben
      {e:"O", x:SIN60, y:COS60, lp:3, charge:"−"},    // −O⁻ rechts-unten
      {e:"O", x:-SIN60, y:COS60, lp:3, charge:"−"}    // −O⁻ links-unten
    ],
    bonds:[{a:0,b:1,o:2},{a:0,b:2,o:1},{a:0,b:3,o:1}],
    name:"Schwefeltrioxid", formula:"SO₃"
  };
}
function coStruct() {
  // ⁻C≡O⁺ ; beide haben Edelgaskonfiguration: C 1 LP + 6 in DB-Region; O 1 LP + 6 in DB-Region
  return {
    atoms:[
      {e:"C", x:-0.5, y:0, lp:1, charge:"−"},
      {e:"O", x:0.5,  y:0, lp:1, charge:"+"}
    ],
    bonds:[{a:0,b:1,o:3}],
    name:"Kohlenmonoxid", formula:"CO"
  };
}

function noStruct() {
  // N=O mit 1 ungepaartes Elektron am N (Edelgasregel: 11 Valenz, 5+6=11)
  // Doppelbindung + 2 LPs am N + 1 ungepaart (insgesamt 5 Valenz an N: 4 in DB-Region + 1 LP + 1 unpaired? 
  // Korrekt: N=O, N hat 1 LP + 1 ungepaartes; O hat 2 LPs.)
  return {
    atoms:[
      {e:"N", x:-0.5, y:0, lp:1, unpaired:1},
      {e:"O", x:0.5,  y:0, lp:2}
    ],
    bonds:[{a:0,b:1,o:2}],
    name:"Stickstoffmonoxid", formula:"NO"
  };
}
function no2Struct() {
  // 17 Valenz-Elektronen: Schul-Resonanzform mit Ladungstrennung.
  // N: 1 ungepaart, formal +; =O (2 LPs); -O⁻ (3 LPs)
  // 1 + 4 + 4 + 6 + 2 = 17 ✓
  return {
    atoms:[
      {e:"N", x:0, y:0, lp:0, unpaired:1, charge:"+"},
      {e:"O", x:-SIN60, y:COS60, lp:2},                     // =O links-unten
      {e:"O", x: SIN60, y:COS60, lp:3, charge:"−"}          // -O⁻ rechts-unten
    ],
    bonds:[{a:0,b:1,o:2},{a:0,b:2,o:1}],
    name:"Stickstoffdioxid", formula:"NO₂"
  };
}
function n2oStruct() {
  // ⁻N=N⁺=O linear; alle Bindungen Länge 1
  return {
    atoms:[
      {e:"N", x:-1, y:0, lp:2, charge:"−"},
      {e:"N", x:0,  y:0, lp:0, charge:"+"},
      {e:"O", x:1,  y:0, lp:2}
    ],
    bonds:[{a:0,b:1,o:2},{a:1,b:2,o:2}],
    name:"Distickstoffmonoxid", formula:"N₂O"
  };
}
function hno3Struct() {
  // HO-N⁺(=O)-O⁻; N sp², drei Bindungen 120°
  // N im Ursprung, =O nach oben (-y), -O- 120° nach unten-rechts, OH-Sauerstoff 120° nach unten-links
  // Anschließend H und O- jeweils mit Bindungslänge 1
  const ng = [
    {e:"N", x:0, y:0, lp:0, charge:"+"},                    // 0 N
    {e:"O", x:0, y:-1, lp:2},                                // 1 =O oben
    {e:"O", x:-SIN60, y:COS60, lp:2},                        // 2 OH-O links-unten
    {e:"O", x: SIN60, y:COS60, lp:3, charge:"−"},            // 3 O- rechts-unten
    // H an O Nr.2 — in Verlängerung der N-O-Achse (= weg von N)
    {e:"H", x:-2*SIN60, y:2*COS60, lp:0}                     // 4 H
  ];
  return {
    atoms: ng,
    bonds:[{a:0,b:1,o:2},{a:0,b:2,o:1},{a:0,b:3,o:1},{a:2,b:4,o:1}],
    name:"Salpetersäure", formula:"HNO₃"
  };
}
function h2so4Struct() {
  // S tetraedrisch (Schul-Kreuz). Bindungen S-O alle Länge 1.
  // 2× =O senkrecht (oben/unten), 2× -OH waagerecht, je H weiter außen.
  return {
    atoms:[
      {e:"S", x:0, y:0, lp:0},
      {e:"O", x:0, y:-1, lp:2},               // 1 =O oben
      {e:"O", x:0, y: 1, lp:2},               // 2 =O unten
      {e:"O", x:-1, y:0, lp:2},               // 3 -O- links
      {e:"H", x:-2, y:0, lp:0},               // 4 H links
      {e:"O", x: 1, y:0, lp:2},               // 5 -O- rechts
      {e:"H", x: 2, y:0, lp:0}                // 6 H rechts
    ],
    bonds:[
      {a:0,b:1,o:2},{a:0,b:2,o:2},
      {a:0,b:3,o:1},{a:3,b:4,o:1},
      {a:0,b:5,o:1},{a:5,b:6,o:1}
    ],
    name:"Schwefelsäure", formula:"H₂SO₄"
  };
}
function h3po4Struct() {
  // P tetraedrisch (Schul-Kreuz). 1× =O oben, 3× -OH (rechts, unten, links).
  return {
    atoms:[
      {e:"P", x:0, y:0, lp:0},
      {e:"O", x:0, y:-1, lp:2},               // 1 =O oben
      {e:"O", x:1, y:0, lp:2},                // 2 -O- rechts
      {e:"H", x:2, y:0, lp:0},                // 3 H rechts
      {e:"O", x:0, y:1, lp:2},                // 4 -O- unten
      {e:"H", x:0, y:2, lp:0},                // 5 H unten
      {e:"O", x:-1, y:0, lp:2},               // 6 -O- links
      {e:"H", x:-2, y:0, lp:0}                // 7 H links
    ],
    bonds:[
      {a:0,b:1,o:2},
      {a:0,b:2,o:1},{a:2,b:3,o:1},
      {a:0,b:4,o:1},{a:4,b:5,o:1},
      {a:0,b:6,o:1},{a:6,b:7,o:1}
    ],
    name:"Phosphorsäure", formula:"H₃PO₄"
  };
}
function naohStruct() {
  // Na⁺ ··· ⁻O-H (Ionenpaar); O sp³ mit 3 LPs
  return {
    atoms:[
      {e:"Na", x:-1.7, y:0, lp:0, charge:"+"},
      {e:"O", x:0, y:0, lp:3, charge:"−"},
      {e:"H", x:1, y:0, lp:0}
    ],
    bonds:[{a:1,b:2,o:1}],
    name:"Natriumhydroxid", formula:"NaOH"
  };
}
function naclStruct() {
  return {
    atoms:[
      {e:"Na", x:-1, y:0, lp:0, charge:"+"},
      {e:"Cl", x:1,  y:0, lp:4, charge:"−"}
    ],
    bonds:[],
    name:"Natriumchlorid", formula:"NaCl"
  };
}
function hcnStruct() {
  // H-C≡N linear, alle Bindungen Länge 1
  return {
    atoms:[
      {e:"H", x:-1, y:0, lp:0},
      {e:"C", x:0,  y:0, lp:0},
      {e:"N", x:1,  y:0, lp:1}
    ],
    bonds:[{a:0,b:1,o:1},{a:1,b:2,o:3}],
    name:"Cyanwasserstoff (Blausäure)", formula:"HCN"
  };
}
function h2o2Struct() {
  // H-O-O-H mit Bindungslängen 1 und Winkeln um 120° an jedem O.
  // O₁ bei (-COS60, 0), O₂ bei (+COS60, 0) → O-O-Bindung = 1
  // H₁ bei O₁ + (cos 120°, sin 120°) = (-COS60-0.5, SIN60) = (-1, +0.866)
  // H₂ bei O₂ + (cos -60°, sin -60°)  = (+COS60+0.5, -SIN60) = (+1, -0.866)
  // Dadurch: H₁-O₁-O₂ Winkel = 120°, O₁-O₂-H₂ Winkel = 120°, Hs trans
  return {
    atoms:[
      {e:"H", x:-1, y: SIN60, lp:0},                  // 0
      {e:"O", x:-COS60, y:0, lp:2},                   // 1
      {e:"O", x: COS60, y:0, lp:2},                   // 2
      {e:"H", x: 1, y:-SIN60, lp:0}                   // 3
    ],
    bonds:[{a:0,b:1,o:1},{a:1,b:2,o:1},{a:2,b:3,o:1}],
    name:"Wasserstoffperoxid", formula:"H₂O₂"
  };
}
function benzeneStruct() {
  const atoms=[], bonds=[];
  const r = 1;
  for (let i=0; i<6; i++) {
    const ang = -Math.PI/2 + i*Math.PI/3;
    atoms.push({e:"C", x: r*Math.cos(ang), y: r*Math.sin(ang), lp:0});
  }
  for (let i=0; i<6; i++) bonds.push({a:i, b:(i+1)%6, o: (i%2===0?2:1)});
  for (let i=0; i<6; i++) {
    const ang = -Math.PI/2 + i*Math.PI/3;
    const hr = r+1;
    atoms.push({e:"H", x: hr*Math.cos(ang), y: hr*Math.sin(ang), lp:0});
    bonds.push({a:i, b:atoms.length-1, o:1});
  }
  return {atoms, bonds, name:"Benzol", formula:"C₆H₆"};
}
function benzeneSkeletal() {
  const atoms=[], bonds=[];
  const r = 1;
  for (let i=0; i<6; i++) {
    const ang = -Math.PI/2 + i*Math.PI/3;
    atoms.push({e:"C", x: r*Math.cos(ang), y: r*Math.sin(ang), lp:0, hidden:true});
  }
  for (let i=0; i<6; i++) bonds.push({a:i, b:(i+1)%6, o: (i%2===0?2:1)});
  return {atoms, bonds, name:"Benzol", formula:"C₆H₆"};
}

/* ============================================================
   AROMATEN-RENDERER (Kekulé mit innenliegenden Doppelbindungen
   + optional mesomere Schreibweise mit Ring in der Mitte).
   Liefert Geometrie — eigene saubere Ringe.
   ============================================================ */
function aromaticSpec(kind) {
  const S = SIN60;                 // 0.866
  function hexVerts(cx, cy) {      // Pointy-Top-Hexagon (Umkreisradius 1)
    const vs = [];
    for (let i=0; i<6; i++) {
      const a = -Math.PI/2 + i*Math.PI/3;
      vs.push([cx + Math.cos(a), cy + Math.sin(a)]);
    }
    return vs;                     // [0 oben, 1 or, 2 ur, 3 unten, 4 ul, 5 ol]
  }
  let centers;
  if (kind === "naphthalene")      centers = [[0,0],[2*S,0]];
  else if (kind === "anthracene")  centers = [[0,0],[2*S,0],[4*S,0]];
  else                             centers = [[0,0]];

  const verts = [];
  const key = (x,y)=>x.toFixed(3)+","+y.toFixed(3);
  const vmap = new Map();
  const addV = (x,y)=>{ const k=key(x,y); if(vmap.has(k)) return vmap.get(k);
    const id=verts.length; verts.push([x,y]); vmap.set(k,id); return id; };

  const edgeMap = new Map();
  centers.forEach(([cx,cy])=>{
    const vs = hexVerts(cx,cy).map(([x,y])=>addV(x,y));
    for(let i=0;i<6;i++){
      const a=vs[i], b=vs[(i+1)%6];
      const ek = a<b ? a+"-"+b : b+"-"+a;
      if(!edgeMap.has(ek)) edgeMap.set(ek,{a,b,ring:[cx,cy],dbl:false});
    }
  });

  const markDbl = (x1,y1,x2,y2)=>{
    const a=vmap.get(key(x1,y1)), b=vmap.get(key(x2,y2));
    if(a==null||b==null) return;
    const ek = a<b ? a+"-"+b : b+"-"+a;
    if(edgeMap.has(ek)) edgeMap.get(ek).dbl=true;
  };
  // Vertex-Helfer relativ zu Ringzentrum
  const T=(c)=>[c[0],   c[1]-1];      // oben
  const OR=(c)=>[c[0]+S,c[1]-0.5];    // oben-rechts
  const UR=(c)=>[c[0]+S,c[1]+0.5];    // unten-rechts
  const B=(c)=>[c[0],   c[1]+1];      // unten
  const UL=(c)=>[c[0]-S,c[1]+0.5];    // unten-links
  const OL=(c)=>[c[0]-S,c[1]-0.5];    // oben-links
  const md=(p,q)=>markDbl(p[0],p[1],q[0],q[1]);

  if(kind==="benzene"){
    const c=centers[0];
    md(T(c),OR(c)); md(UR(c),B(c)); md(UL(c),OL(c));
  } else if(kind==="naphthalene"){
    const A=centers[0], Bc=centers[1];
    // verifizierte Kekulé (jedes C genau eine Doppelbindung, geteilte Kante einfach)
    md(T(A),OL(A));        // e1
    md(UL(A),B(A));        // e3
    md(B(Bc),UL(Bc));      // e5  (UL(B) = unterer Brückenkopf)
    md(UR(Bc),OR(Bc));     // e7
    md(T(Bc),OL(Bc));      // e9  (OL(B) = oberer Brückenkopf)
  } else if(kind==="anthracene"){
    const A=centers[0], Bc=centers[1], C=centers[2];
    md(B(A),UR(A)); md(B(Bc),UR(Bc)); md(B(C),UR(C));
    md(OR(C),T(C)); md(OR(Bc),T(Bc)); md(OR(A),T(A));
    md(OL(A),UL(A));
  }

  return {verts, edges:[...edgeMap.values()], centers};
}

/* Zeichnet ein Aromaten-Skelett als SVG.
   kind: "benzene" | "naphthalene" | "anthracene".
   Bei Benzol wird zusätzlich rechts die mesomere Schreibweise (Ring) gezeigt. */
function renderAromatic(kind, name, formula) {
  const spec = aromaticSpec(kind);
  const showMeso = (kind === "benzene");

  function panel(ox, pw, ph, asCircle) {
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const [x,y] of spec.verts){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    const w=maxX-minX, h=maxY-minY;
    const MARGIN = ph*0.18;
    const scale = Math.min((pw-2*MARGIN)/Math.max(w,0.01), (ph-2*MARGIN)/Math.max(h,0.01));
    const cx0=(minX+maxX)/2, cy0=(minY+maxY)/2;
    const toX = x => ox + pw/2 + (x-cx0)*scale;
    const toY = y => ph/2 + (y-cy0)*scale;
    const stroke = Math.max(4, scale*0.05);
    const out=[];
    const line=(x1,y1,x2,y2,sw)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1c1712" stroke-width="${(sw||stroke).toFixed(1)}" stroke-linecap="round"/>`;
    for(const e of spec.edges){
      const [ax,ay]=spec.verts[e.a], [bx,by]=spec.verts[e.b];
      out.push(line(toX(ax),toY(ay),toX(bx),toY(by)));
    }
    if(asCircle){
      const [rcx,rcy]=spec.centers[0];
      const rad = scale*0.58;
      out.push(`<circle cx="${toX(rcx).toFixed(1)}" cy="${toY(rcy).toFixed(1)}" r="${rad.toFixed(1)}" fill="none" stroke="#1c1712" stroke-width="${stroke.toFixed(1)}"/>`);
    } else {
      for(const e of spec.edges){
        if(!e.dbl) continue;
        const [ax,ay]=spec.verts[e.a], [bx,by]=spec.verts[e.b];
        const Ax=toX(ax),Ay=toY(ay),Bx=toX(bx),By=toY(by);
        const mx=(Ax+Bx)/2, my=(Ay+By)/2;
        const rcx=toX(e.ring[0]), rcy=toY(e.ring[1]);
        let nx=rcx-mx, ny=rcy-my; const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
        const off = scale*0.16;
        const inset = 0.18;
        const ix1=Ax+(Bx-Ax)*inset, iy1=Ay+(By-Ay)*inset;
        const ix2=Bx-(Bx-Ax)*inset, iy2=By-(By-Ay)*inset;
        out.push(line(ix1+nx*off, iy1+ny*off, ix2+nx*off, iy2+ny*off));
      }
    }
    return out.join("\n  ");
  }

  const PH=1000;
  if(showMeso){
    const PW=900, GAP=120, totalW=PW*2+GAP;
    const left = panel(0, PW, PH, false);
    const right = panel(PW+GAP, PW, PH, true);
    const lblY = PH-40;
    return { svg:
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${PH}" width="${totalW}" height="${PH}" preserveAspectRatio="xMidYMid meet">
  <rect width="${totalW}" height="${PH}" fill="#ffffff"/>
  ${left}
  ${right}
  <text x="${PW/2}" y="${lblY}" font-size="44" font-family="'Helvetica Neue',sans-serif" text-anchor="middle" fill="#6c6358">Kekulé</text>
  <text x="${PW+GAP+PW/2}" y="${lblY}" font-size="44" font-family="'Helvetica Neue',sans-serif" text-anchor="middle" fill="#6c6358">mesomer</text>
</svg>`, bondLen:0, atomCount: spec.verts.length };
  }
  const PW=1000;
  const body = panel(0, PW, PH, false);
  return { svg:
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${PH}" width="${PW}" height="${PH}" preserveAspectRatio="xMidYMid meet">
  <rect width="${PW}" height="${PH}" fill="#ffffff"/>
  ${body}
</svg>`, bondLen:0, atomCount: spec.verts.length };
}

function sub(n){ const m="₀₁₂₃₄₅₆₇₈₉"; return String(n).split('').map(d=>m[+d]).join(''); }

/* ---------- Summenformel aus Struktur ableiten (Punkt I) ---------- */
/* Zählt alle Atome einer Strukturformel (inkl. implizit/versteckter sowie
   solcher mit Ladung) und liefert ein Map-Objekt {element: anzahl}. */
function countAtoms(struct) {
  const counts = {};
  if (!struct || !struct.atoms) return counts;
  for (const a of struct.atoms) {
    const e = a.e;
    counts[e] = (counts[e] || 0) + 1;
  }
  return counts;
}

/* Hill-Notation: C zuerst, dann H, dann übrige Elemente alphabetisch.
   Bei reinen Anorganika ohne C: alle Elemente alphabetisch. */
function toHillFormula(counts) {
  const elems = Object.keys(counts);
  if (elems.length === 0) return "";
  const ordered = [];
  if (counts["C"]) { ordered.push("C"); }
  if (counts["H"]) { ordered.push("H"); }
  const rest = elems.filter(e => e !== "C" && e !== "H").sort();
  // Falls kein C vorhanden, H ganz normal alphabetisch einsortieren
  if (!counts["C"]) {
    ordered.length = 0;
    elems.sort().forEach(e => ordered.push(e));
  } else {
    rest.forEach(e => ordered.push(e));
  }
  return ordered.map(e => e + (counts[e] > 1 ? sub(counts[e]) : "")).join("");
}

/* Aggregatzustand bei Standard-Laborbedingungen (1013 hPa, 25 °C).
   Englische Kurzform als Index: (s) solid, (l) liquid, (g) gas, (aq) aqueous.
   Keyed nach Substanz-key; Default-Heuristik greift, falls nicht gelistet. */
const STATE_AT_STP = {
  // Elemente / Gase
  h2:"g", o2:"g", n2:"g", f2:"g", cl2:"g", o3:"g",
  br2:"l", i2:"s",
  He:"g", Ne:"g", Ar:"g",
  c_atom:"s", p_atom:"s", s_atom:"s",
  // Metalle (alle fest)
  li_metal:"s", na_metal:"s", k_metal:"s", mg_metal:"s", ca_metal:"s", al_metal:"s",
  // Übergangsmetalle
  fe_tm:"s", cu_tm:"s", zn_tm:"s", ag_tm:"s", au_tm:"s",
  // Salze (fest)
  nacl:"s", kcl:"s", mgo:"s", cao:"s", caf2:"s", k2o:"s", na2o:"s", mgf2:"s",
  // anorganische Molekülverbindungen
  h2o:"l", co2:"g", co:"g", so2:"g", so3:"l", no:"g", no2:"g", n2o:"g",
  nh3:"g", ch4:"g", h2s:"g", hcl_gas:"g", h2o2:"l",
  // Säuren (wässrig/flüssig)
  hcl:"aq", hbr:"aq", hf:"aq", hi:"aq", hno3:"l", h2so4:"l", h3po4:"l", hcn:"l", h2co3:"aq",
  // Basen
  naoh:"s", koh:"s", caoh2:"s", nh3aq:"aq",
  // organische Sonderfälle (Siedepunkt nahe 25 °C)
  neopentane:"g",   // 2,2-Dimethylpropan, Sdp. 9,5 °C → gasförmig
  alkanal_1:"g",    // Methanal (Formaldehyd), Sdp. −19 °C → gasförmig
  alkanal_2:"g",    // Ethanal (Acetaldehyd), Sdp. 20 °C → bei 25 °C gasförmig
  glycerin:"l",     // viskose Flüssigkeit (Sdp. ≈ 290 °C)
};

/* Default-Heuristik für nicht gelistete Substanzen (v.a. Organik):
   kleine Alkane/Alkene/Alkine gasförmig, mittlere flüssig, große fest. */
function defaultState(subst, counts) {
  const klass = subst.sub || subst.klass;
  let nC = counts["C"] || 0;
  // Fallback: C-Zahl aus der Formelzeichenkette lesen, falls Struktur fehlt
  if (!nC && subst.formula) {
    const m = subst.formula.match(/C([₀₁₂₃₄₅₆₇₈₉]*)/);
    if (m) {
      if (m[1]) {
        const digits = {"₀":0,"₁":1,"₂":2,"₃":3,"₄":4,"₅":5,"₆":6,"₇":7,"₈":8,"₉":9};
        nC = 0; for (const ch of m[1]) nC = nC*10 + digits[ch];
      } else {
        nC = 1; // "C" ohne Index = 1 Kohlenstoff
      }
    }
  }
  // organische Stoffe grob nach C-Zahl
  if (nC > 0) {
    if (["alkan","alken","alkin","alkan_iso","alken_iso","alkin_iso"].includes(klass)) {
      if (nC <= 4) return "g";
      if (nC <= 16) return "l";
      return "s";
    }
    // Alkohole, Aldehyde, Ketone, Säuren, Ester: meist flüssig im Schulkontext
    if (["alkanol","alkanal","alkanon","alkansaeure","ester","aromat"].includes(klass)) {
      if (nC >= 13) return "s";
      return "l";
    }
  }
  return "s";
}

/* Liefert die Summenformel inkl. Aggregatzustand-Index, z.B. "H₂(g)".
   Reihenfolge: hinterlegte (didaktisch korrekte) Formel aus full()/subst,
   nur als letzter Fallback aus Struktur abgeleitete Hill-Formel. */
function formulaWithState(subst) {
  let base = "";
  let struct = null;
  try {
    if (typeof subst.full === "function") {
      struct = subst.full();
      if (struct && struct.formula) base = struct.formula;
    }
  } catch(e) { struct = null; }
  if (!base && subst.formula) base = subst.formula;
  if (!base && struct && struct.atoms && struct.atoms.length) {
    base = toHillFormula(countAtoms(struct));
  }
  // Zustand bestimmen
  let state = STATE_AT_STP[subst.key];
  if (!state) {
    const counts = struct && struct.atoms ? countAtoms(struct) : {};
    state = defaultState(subst, counts);
  }
  return base + "(" + state + ")";
}



/* ============================================================
   KONSTRUKTIONS-ENGINE — EINE Vorschrift für Skelett- und Strukturformeln
   (Polyene, Polyole; die älteren Klassen oben nutzen weiterhin ihre
   Einzelgeneratoren — Regelwerk und Abgleich: training/CLAUDE.md,
   Abschnitt "Formel-Konstruktion").

   Eingabe: eine Kurzschreibweise des Schweratom-Graphen (SMILES-artig)
     Atome     C N O S R(=Rest) H(=explizit gezeichnetes H)
     Bindung   -  =  #   ^ (Keil)  : (gestrichelt)
     Verzweig. ( )       Ringschluss 1–9 (Bindungszeichen davor = Ordnung)
     Marke     C<S> …    (Stereozentrum, Konfiguration R/S); C<a> = α-C einer Aminosäure (Ausrichtung)
   Ausgabe: {atoms:[{e,x,y,lp,hidden}], bonds:[{a,b,o,st?}]} im
   bestehenden Datenmodell (Bindungslänge 1, y nach unten).

   SKELETT-REGELN (Winkel immer relativ zur ankommenden Bindung dIn):
     S1 Kettenschritt   1 Nachfolger  → dIn ± 60°, Vorzeichen s wechselt je
                        Atom (Zickzack = trans/E). sp (Dreifachbindung) → dIn.
     S2 Trigonal        2 Nachfolger  → Hauptkette dIn + s·60°, Zweig dIn − s·60°
                        (= 120° zwischen allen drei Bindungen)
     S3 Kreuz           3 Nachfolger  → dIn, dIn ± 90°
     S4 Ring            n-Eck, gleicher Drehsinn σ; Substituenten auf der
                        Außenwinkelhalbierenden (2 Stück: ± 30°)
     S5 Heteroatom-H    O–H gebogen: C–O-Richtung ± 60° (freiere Seite); S–H ebenso;
                        –NH₂ beide H bei ± 60°, –NH– (Kette/Ring) H auf der Außenwinkelhalbierenden
     S6 Ringsystem      kondensierte Ringe (z. B. Indol): erster Ring wie S4, jeder weitere Ring als
                        regelmäßiges n-Eck an der gemeinsamen Kante, auf der abgewandten Seite;
                        Substituenten auf der Richtung Ringmitte → Atom
   STRUKTUR-REGEL (aus dem Skelett-Gerüst, alle Atome sichtbar):
     L1 Fehlende H (C: 4, N: 3, O/S: 2 Bindungen) werden gleichmäßig in die größte
        Winkellücke verteilt: (Lücke) / (k+1). Ergibt 90° (Kreuz) am sp³-CH₃,
        120° (trigonal) am sp²-C, geradliniges O–H — wie bei den Einzelgeneratoren.
     L2 Fischer-Layout (Polyole): Kette senkrecht, Substituenten waagerecht
        (= Kreuzregel um 90° gedreht), H nach L1.
   STEREO: Fischer-Seite (R/L) bzw. CIP-Marke → Keil/Strich aus den
   tatsächlichen Skelett-Koordinaten (Spatprodukt), nie von Hand.
   ============================================================ */
const DEG = Math.PI / 180;
const ATOMIC_NUM = { H:1, C:6, N:7, O:8, S:16, R:0 };
const VALENCE = { C:4, N:3, O:2, S:2 };
const LONE_PAIRS = { N:1, O:2, S:2 };
const EXO_FAN = 90 * DEG;   // S4: Abstand zweier Substituenten am selben Ringatom (gem-Dimethyl)

function parseSpec(str) {
  const atoms = [], bonds = [], stack = [], rings = {};
  const BOND = { "-":{o:1}, "=":{o:2}, "#":{o:3}, "^":{o:1, st:"wedge"}, ":":{o:1, st:"hash"} };
  let cur = -1, pend = null;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === "(") { stack.push(cur); continue; }
    if (ch === ")") { cur = stack.pop(); continue; }
    if (BOND[ch]) { pend = BOND[ch]; continue; }
    if (ch >= "0" && ch <= "9") {
      if (rings[ch] === undefined) rings[ch] = { atom: cur, bond: pend };
      else {
        const r = rings[ch], b = pend || r.bond || { o:1 };
        bonds.push({ a: r.atom, b: cur, o: b.o, st: b.st, closure: true });
        delete rings[ch];
      }
      pend = null; continue;
    }
    if (ch === "<") { const j = str.indexOf(">", i); atoms[cur].tag = str.slice(i + 1, j); i = j; continue; }
    if (ch >= "A" && ch <= "Z") {
      const idx = atoms.length; atoms.push({ e: ch });
      if (cur >= 0) { const b = pend || { o:1 }; bonds.push({ a: cur, b: idx, o: b.o, st: b.st }); }
      cur = idx; pend = null; continue;
    }
    throw new Error("parseSpec: unerwartetes Zeichen '" + ch + "' in " + str);
  }
  return { atoms, bonds };
}

function analyzeSpec(g) {
  const n = g.atoms.length;
  const kids = Array.from({ length: n }, () => []);
  const parent = new Array(n).fill(-1), inBond = new Array(n).fill(null);
  const closures = [];
  for (const b of g.bonds) {
    if (b.closure) closures.push(b);
    else { kids[b.a].push(b.b); parent[b.b] = b.a; inBond[b.b] = b; }
  }
  const ringOf = new Array(n).fill(-1), rings = [];
  const paths = closures.map(c => {
    const path = [c.b]; let u = c.b;
    while (u !== c.a) { u = parent[u]; if (u < 0) throw new Error("Ringschluss ohne Baumpfad"); path.push(u); }
    return path.reverse();
  });
  // S6: Ringpfad, der einen kleineren Ring vollständig enthält (kondensiertes System, z. B. Indol),
  // über dessen Schlussbindung abkürzen → kleinster Ring
  const fused = new Set();
  paths.forEach((p, r) => paths.forEach((q, t) => {
    if (t === r || q.length >= p.length) return;
    const i = p.indexOf(q[0]), j = p.indexOf(q[q.length - 1]);
    if (i >= 0 && j === p.length - 1 && q.every((a, k) => p[i + k] === a)) {
      paths[r] = p.slice(0, i + 1).concat([p[j]]); fused.add(r); fused.add(t);
    }
  }));
  const sysOf = new Array(n).fill(-1);
  paths.forEach((path, r) => {
    const c = closures[r];
    if (fused.has(r)) { for (const a of path) sysOf[a] = 0; }
    else for (const a of path) { if (ringOf[a] >= 0) throw new Error("verschmolzene Ringe nicht unterstützt"); ringOf[a] = r; }
    rings.push({ opener: c.a, closer: c.b, atoms: path, n: path.length, fused: fused.has(r) });
  });
  return { kids, parent, inBond, rings, ringOf, sysOf };
}

function bondOrderBetween(g, a, b) {
  const bd = g.bonds.find(x => (x.a === a && x.b === b) || (x.a === b && x.b === a));
  return bd ? bd.o : 1;
}

/* S1–S4: Turtle-Layout. opt = {heading, sign, ringSigns[], leaveSign} */
function layoutSpec(g, info, opt) {
  const { kids, inBond, rings, ringOf, sysOf } = info;
  const pos = new Array(g.atoms.length);
  pos[0] = { x: 0, y: 0 };
  const go = (u, c, h, s) => {
    pos[c] = { x: pos[u].x + Math.cos(h), y: pos[u].y + Math.sin(h) };
    place(c, h, s);
  };
  let sysDone = false;
  // S6: kondensiertes Ringsystem vollständig aus regelmäßigen n-Ecken setzen, dann Substituenten nach außen
  function placeSystem(u, dIn, s) {
    sysDone = true;
    const fr = rings.map((r, i) => ({ r, i })).filter(x => x.r.fused);
    const first = fr.find(x => x.r.opener === u);
    if (!first) throw new Error("Ringsystem muss am Öffner des ersten Rings betreten werden");
    const sg = opt.ringSigns[first.i] || 1;
    const poly = (atomsR, startH, turn) => {
      let h = startH;
      for (let k = 1; k < atomsR.length; k++) {
        const a = atomsR[k - 1], b = atomsR[k];
        if (!pos[b]) pos[b] = { x: pos[a].x + Math.cos(h), y: pos[a].y + Math.sin(h) };
        h += turn;
      }
    };
    const r0 = first.r, alpha = (90 - 180 / r0.n) * DEG;
    poly(r0.atoms, dIn - sg * alpha, sg * 2 * Math.PI / r0.n);
    const centre = at => ({ x: at.reduce((q, a) => q + pos[a].x, 0) / at.length, y: at.reduce((q, a) => q + pos[a].y, 0) / at.length });
    let open = fr.filter(x => x !== first);
    while (open.length) {
      const nx = open.find(x => x.r.atoms.some(a => pos[a]));
      open = open.filter(x => x !== nx);
      const R = nx.r, A = R.atoms[0], Z = R.atoms[R.n - 1];
      const placedR = fr.find(x => x !== nx && x.r.atoms.includes(A) && x.r.atoms.includes(Z) && x.r.atoms.every(a => pos[a]));
      const c0 = centre(placedR.r.atoms);
      const base = Math.atan2(pos[A].y - pos[Z].y, pos[A].x - pos[Z].x);
      let best = null;
      for (const t of [1, -1]) {
        const save = R.atoms.map(a => pos[a]);
        R.atoms.slice(1, -1).forEach(a => { pos[a] = undefined; });
        poly(R.atoms, base + t * 2 * Math.PI / R.n, t * 2 * Math.PI / R.n);
        const c = centre(R.atoms), d = Math.hypot(c.x - c0.x, c.y - c0.y);
        if (!best || d > best.d) best = { d, p: R.atoms.map(a => pos[a]) };
        R.atoms.forEach((a, k) => { pos[a] = save[k]; });
      }
      R.atoms.forEach((a, k) => { pos[a] = best.p[k]; });
    }
    for (const x of fr) for (const a of x.r.atoms) {
      const exo = kids[a].filter(k => sysOf[k] !== 0);
      if (!exo.length) continue;
      const c = centre(x.r.atoms), ext = Math.atan2(pos[a].y - c.y, pos[a].x - c.x);
      exo.forEach((k, i) => go(a, k, ext + (i - (exo.length - 1) / 2) * EXO_FAN, opt.leaveSign));
    }
  }
  function place(u, dIn, s) {
    const ks = kids[u];
    if (sysOf && sysOf[u] === 0) { if (!sysDone) placeSystem(u, u === 0 ? opt.heading + Math.PI : dIn, s); return; }
    if (!ks.length) return;
    if (u === 0) {                                             // Wurzel: erste Bindung frei wählbar
      if (ks.length === 1) go(u, ks[0], opt.heading, opt.sign);
      else ks.forEach((c, i) => go(u, c, opt.heading + (i - (ks.length - 1) / 2) * 120 * DEG, opt.sign));
      return;
    }
    if (ringOf[u] >= 0) {                                      // S4 Ring
      const r = rings[ringOf[u]], sg = opt.ringSigns[ringOf[u]] || 1;
      const alpha = (90 - 180 / r.n) * DEG;
      const idx = r.atoms.indexOf(u);
      const ringKid = u === r.closer ? -1 : r.atoms[idx + 1];
      const exo = ks.filter(k => k !== ringKid);
      let hf, ext;
      if (u === r.opener) { hf = dIn - sg * alpha; ext = dIn + Math.PI; }
      else { hf = dIn + sg * 2 * Math.PI / r.n; ext = dIn - sg * alpha; }
      if (ringKid >= 0) go(u, ringKid, hf, s);
      const m = exo.length + (u === r.opener ? 1 : 0);        // Opener: Elternbindung belegt schon die Mitte
      exo.forEach((c, i) => {
        const slot = u === r.opener ? i + 1 : i;
        go(u, c, ext + (slot - (m - 1) / 2) * EXO_FAN, opt.leaveSign);
      });
      return;
    }
    const linear = inBond[u].o === 3 || ks.some(k => bondOrderBetween(g, u, k) === 3);
    if (ks.length === 1) go(u, ks[0], linear ? dIn : dIn + s * 60 * DEG, linear ? s : -s);          // S1
    else if (ks.length === 2) {                                                                     // S2
      go(u, ks[1], dIn + s * 60 * DEG, -s);
      go(u, ks[0], dIn - s * 60 * DEG, s);
    } else if (ks.length === 3) {                                                                   // S3
      go(u, ks[2], dIn, s);
      go(u, ks[0], dIn - 90 * DEG, s);
      go(u, ks[1], dIn + 90 * DEG, s);
    } else throw new Error("zu viele Nachfolger");
  }
  place(0, null, opt.sign);
  return pos;
}

function normAng(a) { a %= 2 * Math.PI; return a < 0 ? a + 2 * Math.PI : a; }

/* L1: k H-Atome in die Winkellücken verteilen (Lücke/(m+1), größte Restlücke zuerst) */
function distributeAngles(occupied, k) {
  if (k <= 0) return [];
  if (!occupied.length) return Array.from({ length: k }, (_, i) => -Math.PI / 2 + i * 2 * Math.PI / k);
  const s = occupied.map(normAng).sort((a, b) => a - b);
  const gaps = s.map((a, i) => {
    const nxt = i + 1 < s.length ? s[i + 1] : s[0] + 2 * Math.PI;
    return { start: a, size: nxt - a, m: 0 };
  });
  for (let h = 0; h < k; h++) {
    let best = null;
    for (const g of gaps) {
      const cur = g.size / (g.m + 1);
      if (!best || cur > best.cur + 1e-9 || (Math.abs(cur - best.cur) < 1e-9 && g.size > best.g.size)) best = { g, cur };
    }
    best.g.m++;
  }
  const out = [];
  for (const g of gaps) for (let j = 1; j <= g.m; j++) out.push(g.start + g.size * j / (g.m + 1));
  return out;
}

function neighborAngles(atoms, bonds, i) {
  const out = []; let order = 0;
  for (const b of bonds) {
    const j = b.a === i ? b.b : b.b === i ? b.a : -1;
    if (j < 0) continue;
    order += b.o;
    out.push(Math.atan2(atoms[j].y - atoms[i].y, atoms[j].x - atoms[i].x));
  }
  return { angles: out, order };
}

/* L1: fehlende H ergänzen (nur C und O). smart=true: jede Lückenregel-Position wird
   um höchstens ±40° verschoben, wenn sich dadurch der Abstand zu anderen Atomen vergrößert
   (kollisionsfrei bei gem-Dimethyl, Ringen, dicht gepackten Ketten). */
function fillHydrogens(struct, smart) {
  const atoms = struct.atoms.map(a => ({ ...a, hidden: false }));
  const bonds = struct.bonds.map(b => ({ ...b }));
  const n0 = atoms.length;
  for (let i = 0; i < n0; i++) {
    const v = VALENCE[atoms[i].e];
    if (!v) continue;
    const { angles, order } = neighborAngles(atoms, bonds, i);
    const placed = angles.slice();
    for (let a of distributeAngles(angles, v - order)) {
      if (smart) {
        let best = null;
        for (let d = -40; d <= 40; d += 5) {
          const t = a + d * DEG;
          if (placed.some(q => Math.abs(Math.atan2(Math.sin(t - q), Math.cos(t - q))) < 40 * DEG)) continue;
          const hx = atoms[i].x + Math.cos(t), hy = atoms[i].y + Math.sin(t);
          let md = Infinity;
          for (let j = 0; j < atoms.length; j++) if (j !== i) md = Math.min(md, Math.hypot(atoms[j].x - hx, atoms[j].y - hy));
          const sc = Math.min(md, 1.15) - 0.0025 * Math.abs(d);
          if (!best || sc > best.sc) best = { sc, t };
        }
        if (best) a = best.t;
      }
      placed.push(a);
      atoms.push({ e: "H", x: atoms[i].x + Math.cos(a), y: atoms[i].y + Math.sin(a), lp: 0 });
      bonds.push({ a: i, b: atoms.length - 1, o: 1 });
    }
  }
  if (smart) relaxHydrogens(atoms, bonds, n0);
  return { ...struct, atoms, bonds };
}

/* Nachbesserung als Energie-Minimierung: E = Σ max(0, 0.95 − Abstand)² über alle Atompaare eines H.
   Erst Gruppendrehung aller H eines Atoms (z. B. CH₃-Kreuz), dann Einzeldrehung jedes H im Vollkreis
   (Mindestabstand 40° zu den übrigen Bindungen des Elternatoms). Mehrere Durchläufe, weil sich
   Nachbar-H gegenseitig beeinflussen. */
function relaxHydrogens(atoms, bonds, n0) {
  const T = 0.95, SEP = 40 * DEG;
  const hs = [];
  for (const b of bonds) if (b.b >= n0 && atoms[b.b].e === "H") hs.push({ h: b.b, p: b.a });
  const ang = h => Math.atan2(atoms[h.h].y - atoms[h.p].y, atoms[h.h].x - atoms[h.p].x);
  const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
  const energy = (x, y, skip) => {
    let e = 0;
    for (let j = 0; j < atoms.length; j++) {
      if (skip.has(j)) continue;
      const d = Math.hypot(atoms[j].x - x, atoms[j].y - y);
      if (d < T) e += (T - d) * (T - d);
    }
    return e;
  };
  const byParent = new Map();
  for (const x of hs) { if (!byParent.has(x.p)) byParent.set(x.p, []); byParent.get(x.p).push(x); }
  const otherBondAngles = (p, group) => {
    const out = [];
    for (const b of bonds) {
      const j = b.a === p ? b.b : b.b === p ? b.a : -1;
      if (j >= 0 && !group.some(g => g.h === j)) out.push(Math.atan2(atoms[j].y - atoms[p].y, atoms[j].x - atoms[p].x));
    }
    return out;
  };
  for (let pass = 0; pass < 5; pass++) {
    for (const [p, group] of byParent) {                    // Gruppendrehung
      if (group.length < 2) continue;
      const fixed = otherBondAngles(p, group), base = group.map(ang);
      const skip = new Set([p, ...group.map(g => g.h)]);
      let best = null;
      for (let f = -180; f < 180; f += 5) {
        const t = base.map(a => a + f * DEG);
        if (t.some(a => fixed.some(q => angDiff(a, q) < SEP))) continue;
        let e = 0;
        t.forEach(a => { e += energy(atoms[p].x + Math.cos(a), atoms[p].y + Math.sin(a), skip); });
        e += 0.0002 * Math.abs(f);
        if (!best || e < best.e - 1e-9) best = { e, t };
      }
      if (best) group.forEach((g, i) => { atoms[g.h].x = atoms[p].x + Math.cos(best.t[i]); atoms[g.h].y = atoms[p].y + Math.sin(best.t[i]); });
    }
    for (const g of hs) {                                   // Einzeldrehung
      const group = byParent.get(g.p);
      const fixed = otherBondAngles(g.p, [g]);
      const skip = new Set([g.p, g.h]);
      let best = null;
      for (let d = 0; d < 360; d += 5) {
        const t = d * DEG;
        if (fixed.some(q => angDiff(t, q) < SEP)) continue;
        const e = energy(atoms[g.p].x + Math.cos(t), atoms[g.p].y + Math.sin(t), skip);
        const cur = angDiff(t, ang(g));
        const sc = e + 0.0002 * cur * 57.3;
        if (!best || sc < best.sc - 1e-9) best = { sc, t };
      }
      if (best) { atoms[g.h].x = atoms[g.p].x + Math.cos(best.t); atoms[g.h].y = atoms[g.p].y + Math.sin(best.t); }
    }
  }
}

/* S5: Hydroxyl-H im Skelett gebogen (C–O ± 60°), auf der freieren Seite */
function addSkeletalHeteroH(atoms, bonds) {
  const n0 = atoms.length;
  for (let i = 0; i < n0; i++) {
    if (atoms[i].e === "N" || atoms[i].e === "S") { addSkeletalNSH(atoms, bonds, i); continue; }
    if (atoms[i].e !== "O") continue;
    const { angles, order } = neighborAngles(atoms, bonds, i);
    if (order >= 2 || angles.length !== 1) continue;
    const back = angles[0] + Math.PI;
    let best = null;
    for (const d of [60 * DEG, -60 * DEG]) {
      const hx = atoms[i].x + Math.cos(back + d), hy = atoms[i].y + Math.sin(back + d);
      let md = Infinity;
      for (let j = 0; j < atoms.length; j++) if (j !== i) md = Math.min(md, Math.hypot(atoms[j].x - hx, atoms[j].y - hy));
      if (!best || md > best.md + 1e-9) best = { d, md, hx, hy };
    }
    atoms.push({ e: "H", x: best.hx, y: best.hy, lp: 0 });
    bonds.push({ a: i, b: atoms.length - 1, o: 1 });
  }
}

/* S5 für N und S: –SH und –NH (1 H, ein Nachbar) gebogen auf der freieren Seite, –NH₂ beide H bei ± 60°,
   –NH– mit zwei Nachbarn (Kette, Ring) H auf der Außenwinkelhalbierenden */
function addSkeletalNSH(atoms, bonds, i) {
  const { angles, order } = neighborAngles(atoms, bonds, i);
  const k = VALENCE[atoms[i].e] - order;
  if (k <= 0) return;
  const add = t => { atoms.push({ e: "H", x: atoms[i].x + Math.cos(t), y: atoms[i].y + Math.sin(t), lp: 0 }); bonds.push({ a: i, b: atoms.length - 1, o: 1 }); };
  if (angles.length === 2 && k === 1) {
    add(Math.atan2(Math.sin(angles[0]) + Math.sin(angles[1]), Math.cos(angles[0]) + Math.cos(angles[1])) + Math.PI);
    return;
  }
  if (angles.length !== 1) return;
  const back = angles[0] + Math.PI;
  if (k >= 2) { add(back + 60 * DEG); add(back - 60 * DEG); return; }
  let best = null;
  for (const d of [60 * DEG, -60 * DEG]) {
    const hx = atoms[i].x + Math.cos(back + d), hy = atoms[i].y + Math.sin(back + d);
    let md = Infinity;
    for (let j = 0; j < atoms.length; j++) if (j !== i) md = Math.min(md, Math.hypot(atoms[j].x - hx, atoms[j].y - hy));
    if (!best || md > best.md + 1e-9) best = { d, md };
  }
  add(back + best.d);
}

function layoutQuality(atoms, thr) {
  thr = thr || 0.72;
  let viol = 0, minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < atoms.length; i++) {
    minX = Math.min(minX, atoms[i].x); maxX = Math.max(maxX, atoms[i].x);
    minY = Math.min(minY, atoms[i].y); maxY = Math.max(maxY, atoms[i].y);
    for (let j = i + 1; j < atoms.length; j++) if (Math.hypot(atoms[i].x - atoms[j].x, atoms[i].y - atoms[j].y) < thr) viol++;
  }
  return { viol, w: maxX - minX, h: maxY - minY };
}

/* CIP-Näherung für azyklische/einfache Fälle: Rang der Nachbarn nach Kugeln (nur für Marken <R>/<S>) */
function cipRank(g, center) {
  const adj = g.atoms.map(() => []);
  for (const b of g.bonds) { adj[b.a].push({ to: b.b, o: b.o }); adj[b.b].push({ to: b.a, o: b.o }); }
  const nbrs = adj[center].map(x => x.to);
  const sphere = (start, from) => {                       // Kugelweise Atomnummern, Doppelbindungen duplizieren
    const out = []; let front = [{ at: start, from }];
    for (let d = 0; d < 4; d++) {
      const nxt = [], nums = [];
      for (const f of front) {
        const subs = [];
        for (const e of adj[f.at]) if (e.to !== f.from) for (let r = 0; r < e.o; r++) subs.push(e.to);
        const hCount = (VALENCE[g.atoms[f.at].e] || 0) - adj[f.at].reduce((s, e) => s + e.o, 0);
        for (const t of subs) { nums.push(ATOMIC_NUM[g.atoms[t].e]); nxt.push({ at: t, from: f.at }); }
        for (let h = 0; h < hCount; h++) nums.push(1);
      }
      out.push(nums.sort((a, b) => b - a)); front = nxt;
    }
    return out;
  };
  const key = n => [[ATOMIC_NUM[g.atoms[n].e]], ...sphere(n, center)];
  const cmp = (a, b) => {
    const ka = key(a), kb = key(b);
    for (let d = 0; d < ka.length; d++) {
      const x = ka[d], y = kb[d];
      for (let i = 0; i < Math.max(x.length, y.length); i++) {
        const dx = (x[i] ?? -1) - (y[i] ?? -1);
        if (dx) return -dx;
      }
    }
    return 0;
  };
  return nbrs.slice().sort(cmp);
}

/* Keil/Strich für Stereozentren mit Marke <R>/<S>: Substituent p1 (höchste Priorität) bekommt die Markierung.
   Mit Keil auf p1 liegt H hinten; im Uhrzeigersinn (SVG y↓: positives Kreuzprodukt) = R. */
function applyCipStereo(g, atoms, bonds) {
  g.atoms.forEach((ga, c) => {
    if (ga.tag !== "R" && ga.tag !== "S") return;
    const [p1, p2, p3] = cipRank(g, c);
    const A = atoms[p1], B = atoms[p2], C = atoms[p3];
    const area = (B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y);
    const withWedge = area > 0 ? "R" : "S";
    const st = withWedge === ga.tag ? "wedge" : "hash";
    const bd = bonds.find(b => (b.a === c && b.b === p1) || (b.a === p1 && b.b === c));
    if (bd.a !== c) { const t = bd.a; bd.a = bd.b; bd.b = t; }
    bd.st = st;
  });
}

/* Skelett aus Kurzschreibweise: wählt Startrichtung/Drehsinne so, dass nichts überlappt und die Kette
   waagerecht (größtes Seitenverhältnis) mit dem ersten Atom links liegt. */
function buildSkeleton(spec, name, formula, hooks) {
  const g = parseSpec(spec), info = analyzeSpec(g);
  const nR = info.rings.length;
  const cands = [];
  for (let hd = 0; hd < 360; hd += 30) for (const sign of [1, -1]) for (const leave of [1, -1])
    for (let mask = 0; mask < (1 << nR); mask++) {
      const opt = { heading: hd * DEG, sign, leaveSign: leave, ringSigns: info.rings.map((_, i) => (mask >> i) & 1 ? -1 : 1) };
      const pos = layoutSpec(g, info, opt);
      const atoms = g.atoms.map((a, i) => ({ e: a.e, x: pos[i].x, y: pos[i].y, lp: LONE_PAIRS[a.e] || 0, hidden: a.e === "C" }));
      const bonds = g.bonds.map(b => ({ a: b.a, b: b.b, o: b.o, st: b.st }));
      const core = { atoms: atoms.map(a => ({ ...a })), bonds: bonds.map(b => ({ ...b })) };
      addSkeletalHeteroH(atoms, bonds);
      if (hooks && hooks.stereo) { hooks.stereo(g, core.atoms, core.bonds); hooks.stereo(g, atoms, bonds); }
      applyCipStereo(g, core.atoms, core.bonds);
      applyCipStereo(g, atoms, bonds);
      const q = layoutQuality(atoms);
      const qL = layoutQuality(fillHydrogens(core, false).atoms, 0.8);
      const cx = atoms.reduce((s, a) => s + a.x, 0) / atoms.length;
      const hashes = bonds.filter(b => b.st === "hash").length;
      const flat = q.w >= ((hooks && hooks.flat) || 2.5) * q.h ? 0 : 1;
      // Rangfolge: 1. Skelett ohne Überlappung, 2. Kette waagerecht, 3. Keile vor Strichen (Vorlagen: Keil),
      // 4. Struktur (mit H) möglichst überlappungsfrei, 5. erstes Atom links, 6. Seitenverhältnis
      // hooks.orient: Strafpunkte für unerwünschte Ausrichtung (Aminosäuren), nachrangig zu Überlappungen
      const orient = hooks && hooks.orient ? hooks.orient(g, atoms) : 0;
      cands.push({ score: [q.viol * 10 + orient, flat, hashes, qL.viol, atoms[0].x > cx ? 1 : 0, -Math.round(100 * q.w / Math.max(q.h, 0.5))], atoms, bonds, core });
    }
  const cmp = (a, b) => { for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) return a[k] - b[k]; return 0; };
  cands.sort((a, b) => cmp(a.score, b.score));
  // Feinauswahl: unter den besten Layouts (gleiche Ränge 1–2) das mit den wenigsten H-Überlappungen nach der Nachbesserung
  const top = cands.filter(c => c.score[0] === cands[0].score[0] && c.score[1] === cands[0].score[1] && c.score[2] === cands[0].score[2]).slice(0, 5);
  let best = null;
  for (const c of top) {
    const v = layoutQuality(fillHydrogens(c.core, true).atoms, 0.8).viol;
    if (!best || v < best.v) best = { v, c };
  }
  best = best.c;
  return {
    skeletal: { atoms: best.atoms, bonds: best.bonds, name, formula },
    core: { atoms: best.core.atoms, bonds: best.core.bonds, name, formula },
    graph: g
  };
}

/* Skelett → Struktur (L1): dieselben Koordinaten, alle C sichtbar, H nach Lückenregel */
function structuralFromCore(core, note) {
  const s = fillHydrogens(core, true);
  if (note) s.note = note;
  return s;
}

/* ---------- Aminosäuren: α-C (Marke <a>) mit Carboxylgruppe rechts und Aminogruppe unten ---------- */
function aminoOrient(g, atoms) {
  const c = g.atoms.findIndex(a => a.tag === "a");
  if (c < 0) return 0;
  const nb = g.bonds.filter(b => b.a === c || b.b === c).map(b => (b.a === c ? b.b : b.a));
  const cooh = nb.find(j => g.atoms[j].e === "C" && g.bonds.some(b => (b.a === j || b.b === j) && b.o === 2 && g.atoms[b.a === j ? b.b : b.a].e === "O"));
  const n = nb.find(j => g.atoms[j].e === "N");
  let pen = 0;
  if (cooh !== undefined && !(atoms[cooh].x > atoms[c].x + 0.3)) pen += 2;
  if (n !== undefined && !(atoms[n].y > atoms[c].y + 0.3)) pen += 1;
  return pen;
}

/* ---------- Polyole: Fischer-Layout (L2) + Skelett mit abgeleiteter Stereochemie ---------- */
function fischerStruct(chain, name, formula) {
  const atoms = [], bonds = [];
  const add = (e, x, y, lp) => { atoms.push({ e, x, y, lp: lp || 0 }); return atoms.length - 1; };
  const cI = chain.map((c, i) => add("C", 0, i));
  for (let i = 0; i < chain.length - 1; i++) bonds.push({ a: cI[i], b: cI[i + 1], o: 1 });
  chain.forEach((c, i) => {
    if (c.t === "CHOH") { const o = add("O", c.side === "R" ? 1 : -1, i, 2); bonds.push({ a: cI[i], b: o, o: 1 }); }
    else if (c.t === "CH2OH") { const o = add("O", 0, i === 0 ? -1 : i + 1, 2); bonds.push({ a: cI[i], b: o, o: 1 }); }
    else if (c.t === "CHO") { const o = add("O", Math.cos(-30 * DEG), Math.sin(-30 * DEG), 2); bonds.push({ a: cI[i], b: o, o: 2 }); }
  });
  return fillHydrogens({ atoms, bonds, name, formula });
}

function polyolSkeleton(chain, name, formula) {
  let spec = chain[0].t === "CHO" ? "O=C(H)" : "OC";
  const tagged = {};
  for (let i = 1; i < chain.length; i++) {
    if (chain[i].t === "CHOH" && chain[i].side && chain[i].stereo !== false) { spec += `C<${i}>(O)`; tagged[i] = chain[i].side; }
    else if (chain[i].t === "CHOH") spec += "C(O)";
    else spec += "CO";
  }
  const stereo = (g, atoms, bonds) => {
    g.atoms.forEach((ga, c) => {
      if (ga.tag === undefined || !(ga.tag in tagged)) return;
      const bondsOf = bonds.filter(b => b.a === c || b.b === c).map(b => (b.a === c ? b.b : b.a));
      const prev = g.bonds.find(b => b.b === c && !b.closure).a;
      const oxy = bondsOf.find(j => atoms[j].e === "O");
      const next = bondsOf.find(j => j !== prev && j !== oxy && atoms[j].e === "C");
      const P = { x: atoms[prev].x - atoms[c].x, y: -(atoms[prev].y - atoms[c].y) };
      const N = { x: atoms[next].x - atoms[c].x, y: -(atoms[next].y - atoms[c].y) };
      const fischer = tagged[ga.tag] === "R" ? -1 : 1;
      const cross = P.x * N.y - P.y * N.x;
      const bd = bonds.find(b => (b.a === c && b.b === oxy) || (b.a === oxy && b.b === c));
      if (bd.a !== c) { const t = bd.a; bd.a = bd.b; bd.b = t; }
      bd.st = fischer / Math.sign(cross) > 0 ? "wedge" : "hash";
    });
  };
  return buildSkeleton(spec, name, formula, { stereo, flat: 1.2 });
}

/* Hilfsfunktion: hängt ein CH3 an Position (mx,my) an Atom-Index parentIdx an.
   Die 3 H-Atome werden radial nach außen (weg vom Parent) gefächert,
   sodass keine Überlappung mit Nachbargruppen entsteht.
   bondLen-normiert: H-Abstand = 1. */
function attachMethylRadial(atoms, bonds, parentIdx, px, py, mx, my, fanSpread) {
  const cIdx = atoms.length;
  atoms.push({e:"C", x: mx, y: my, lp:0});
  bonds.push({a: parentIdx, b: cIdx, o:1});
  // Außenrichtung (vom Parent zum Methyl, normiert)
  const dx = mx - px, dy = my - py;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx/len, uy = dy/len;
  const baseAng = Math.atan2(uy, ux);
  // 3 Hs: einer radial nach außen, zwei seitlich um ±fanSpread (Default 120°).
  const spread = (typeof fanSpread === "number") ? fanSpread : 2*Math.PI/3;
  for (const off of [0, spread, -spread]) {
    const a = baseAng + off;
    atoms.push({e:"H", x: mx + Math.cos(a), y: my + Math.sin(a), lp:0});
    bonds.push({a: cIdx, b: atoms.length-1, o:1});
  }
}

/* Globale Hilfsfunktion: fügt 'count' H-Atome an Atom cIdx (Position cx,cy) hinzu,
   platziert an den freiesten Winkeln (maximaler Mindestabstand zu Nachbarn).
   Bindungslänge 1, keine Überlappung. */
function addHsRadial(atoms, bonds, cIdx, cx, cy, neighborIdxs, count) {
  const occ = neighborIdxs.map(ni => Math.atan2(atoms[ni].y - cy, atoms[ni].x - cx));
  for (let n=0;n<count;n++){
    let bestAng=0,bestMin=-1;
    for(let deg=0;deg<360;deg+=4){
      const a=deg*Math.PI/180;
      let mind=Infinity;
      for(const o of occ){let d=Math.abs(Math.atan2(Math.sin(a-o),Math.cos(a-o)));if(d<mind)mind=d;}
      if(mind>bestMin){bestMin=mind;bestAng=a;}
    }
    atoms.push({e:"H", x:cx+Math.cos(bestAng), y:cy+Math.sin(bestAng), lp:0});
    bonds.push({a:cIdx, b:atoms.length-1, o:1});
    occ.push(bestAng);
  }
}
