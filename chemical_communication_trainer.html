<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemical Communication Trainer</title>
<style>
  :root {
    --bg: #0d0f1a;
    --card: #151828;
    --card2: #1a1e32;
    --accent: #7c6af7;
    --accent2: #e96dbd;
    --accent3: #5dd8c8;
    --green: #00c853;
    --gold: #ffd700;
    --pink: #ff6b9d;
    --blue: #4fc3f7;
    --purple: #b388ff;
    --red: #f55a5a;
    --orange: #ffa726;
    --text: #e8eaf6;
    --dim: #8890b8;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "Nunito", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    padding: 1.5rem 1rem 4rem;
    background-image:
      radial-gradient(ellipse 60% 50% at 15% 20%, rgba(124,106,247,.1) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 85% 80%, rgba(233,109,189,.08) 0%, transparent 70%);
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* === HEADER === */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }
  h1 small {
    display: block;
    font-size: 0.7rem;
    color: var(--dim);
    -webkit-text-fill-color: var(--dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 0.15rem;
    font-weight: 500;
  }
  .header-right { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .lang-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; overflow: hidden; }
  .lang-btn {
    background: transparent;
    color: var(--dim);
    border: none;
    padding: 0.35rem 0.75rem;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .lang-btn.active {
    background: var(--accent);
    color: white;
  }
  .mode-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.32rem 0.75rem;
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 8px;
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 600;
  }
  .change-mode {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.18);
    color: var(--dim);
    padding: 0.3rem 0.7rem;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .change-mode:hover { color: var(--text); border-color: var(--accent); }

  /* === MODE SELECT (START SCREEN) === */
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
    margin-top: 2rem;
  }
  .mode-card {
    background: linear-gradient(135deg, var(--card), var(--card2));
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 1.5rem 1.25rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .mode-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(124,106,247,0.18), transparent 60%);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .mode-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(124,106,247,0.18);
  }
  .mode-card:hover::before { opacity: 1; }
  .mode-card > * { position: relative; z-index: 1; }
  .mode-emoji { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .mode-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text); }
  .mode-desc { color: var(--dim); font-size: 0.85rem; line-height: 1.55; }

  /* === SECTIONS === */
  section { margin-bottom: 1.25rem; }
  .section-title {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--pink);
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .panel {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }

  /* === BUTTONS === */
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    padding: 0.65rem 1.4rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(124,106,247,0.34); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .btn.ghost:hover {
    background: var(--accent);
    color: white;
  }
  .btn.small { padding: 0.4rem 0.85rem; font-size: 0.82rem; }
  .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-top: 0.6rem; }

  /* === NAME INPUT / CSV === */
  .name-input-area {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.6rem;
  }
  textarea.names-area {
    width: 100%;
    min-height: 90px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 0.65rem 0.8rem;
    font-family: inherit;
    color: var(--text);
    font-size: 0.92rem;
    resize: vertical;
  }
  textarea.names-area:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .name-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.5rem;
  }
  .name-chip {
    background: rgba(124,106,247,0.12);
    color: var(--accent);
    border: 1px solid rgba(124,106,247,0.3);
    padding: 0.18rem 0.6rem;
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .name-chip.used { opacity: 0.35; text-decoration: line-through; }
  .name-chip.current { background: var(--gold); color: #1a1500; border-color: var(--gold); }

  /* === YEAR BUTTONS === */
  .year-btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .year-btn {
    background: var(--card2);
    color: var(--text);
    border: 2px solid rgba(255,255,255,0.08);
    padding: 0.55rem 1.2rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .year-btn:hover { border-color: var(--accent3); color: var(--accent3); }
  .year-btn.active {
    background: var(--accent3);
    color: #0d1f1c;
    border-color: var(--accent3);
  }

  /* === CLASS GRID (Auswahl) === */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.55rem;
  }
  .class-btn {
    background: var(--card2);
    color: var(--text);
    border: 1.5px solid rgba(255,255,255,0.08);
    padding: 0.55rem 0.8rem;
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .class-btn .emoji { font-size: 1.05rem; flex-shrink: 0; }
  .class-btn .count { color: var(--dim); font-size: 0.7rem; margin-left: auto; }
  .class-btn:hover { border-color: var(--accent); }
  .class-btn.active {
    background: rgba(124,106,247,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .class-btn.active .count { color: var(--accent); }

  /* Info-Feld (SEK I / SEK II / Vertiefung) oben rechts an jeder Stoffklasse */
  .class-cell { position: relative; }
  .class-cell .class-btn { width: 100%; height: 100%; }
  .class-info-btn {
    position: absolute; top: -7px; right: -5px; z-index: 2;
    min-width: 18px; height: 18px; padding: 0 0.3rem;
    border-radius: 9px; border: 1px solid rgba(93,216,200,0.55);
    background: var(--card); color: var(--accent3);
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700;
    font-size: 0.66rem; line-height: 16px; cursor: pointer;
  }
  .class-info-btn.deep { border-color: rgba(255,215,0,0.6); color: var(--gold); }
  .class-info-btn:hover, .class-info-btn.open { background: var(--card2); border-color: currentColor; }
  .class-info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .class-info-pop {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 30;
    min-width: 210px; padding: 0.5rem 0.7rem;
    background: var(--card2); border: 1px solid var(--accent); border-radius: 9px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45); text-align: left;
  }
  .lvl-row { display: flex; align-items: baseline; gap: 0.45rem; font-size: 0.8rem; padding: 0.15rem 0; }
  .lvl-row .lvl-dot { font-size: 0.7rem; }
  .lvl-row.on { color: var(--text); font-weight: 700; }
  .lvl-row.on .lvl-dot { color: var(--accent3); }
  .lvl-row.off { color: var(--dim); }
  .lvl-row .lvl-detail { color: var(--accent3); font-weight: 600; font-size: 0.74rem; margin-left: auto; }

  /* === SUBSTANCE LIST (Export-Modus) === */
  .substance-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.4rem;
    max-height: 380px;
    overflow-y: auto;
    padding: 0.4rem 0.2rem;
  }
  .substance-item {
    background: var(--card2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 7px;
    padding: 0.45rem 0.7rem;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.12s;
    color: var(--text);
  }
  .substance-item .formula { color: var(--dim); font-size: 0.75rem; font-style: italic; margin-left: 0.4em; }
  .substance-item:hover {
    background: rgba(124,106,247,0.1);
    border-color: var(--accent);
  }
  .substance-item.active {
    background: rgba(255,215,0,0.1);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* === STATS === */
  .stats {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    margin: 0.6rem 0;
  }
  .stat {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }
  .stat strong { color: var(--gold); }

  /* === TASK CARD === */
  .task-card {
    background: linear-gradient(135deg, #0a0d18, #131736);
    border: 2px solid rgba(124,106,247,0.25);
    border-radius: var(--radius);
    padding: 1.5rem 1.3rem;
    position: relative;
    overflow: hidden;
    margin: 1rem 0;
  }
  .task-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(transparent 30%, rgba(124,106,247,0.06), transparent 60%, rgba(233,109,189,0.04), transparent);
    animation: spin 16s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .task-card > * { position: relative; z-index: 1; }
  .task-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.7rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .task-class-label {
    font-size: 0.72rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: rgba(255,255,255,0.04);
    padding: 0.18rem 0.65rem;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .task-player {
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 700;
  }
  .task-prompt {
    color: var(--dim);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0.8rem 0 0.3rem;
    font-weight: 700;
  }

  /* === TASK TILES === */
  .task-tiles {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    margin-top: 0.7rem;
  }
  @media (max-width: 580px) {
    .task-tiles { grid-template-columns: 1fr; }
  }
  .task-tile {
    background: rgba(255,255,255,0.02);
    border: 2px solid rgba(255,255,255,0.07);
    border-radius: 11px;
    padding: 0.85rem;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    color: var(--text);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .task-tile:hover:not(.revealed) {
    background: rgba(124,106,247,0.06);
    border-color: var(--accent);
  }
  .task-tile.revealed {
    background: white;
    border-color: var(--green);
    cursor: default;
    color: #1a1500;
    min-height: 130px;
    padding: 0.5rem;
  }
  .tile-emoji { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .tile-label {
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: inherit;
  }
  .tile-hint {
    font-size: 0.7rem;
    color: var(--dim);
    margin-top: 0.3rem;
  }
  .tile-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.3rem;
  }
  .tile-content .name-de {
    font-weight: 700;
    font-size: 1.05rem;
    color: #1c1712;
  }
  .tile-content .name-en {
    font-size: 0.8rem;
    color: #7a7368;
    font-style: italic;
    margin-top: 0.2rem;
  }
  .tile-content .formula {
    font-family: "DM Mono", "SFMono-Regular", monospace;
    font-size: 1.25rem;
    font-weight: 700;
    color: #1c1712;
  }
  .state-index {
    font-size: 0.62em;
    font-weight: 600;
    color: #6c6358;
    vertical-align: sub;
  }
  .tile-content img,
  .tile-content svg {
    max-width: 100%;
    max-height: 200px;
    display: block;
  }
  .task-tile.wide { grid-column: 1 / -1; }
  .task-tile.wide .tile-content svg { width: 100%; max-height: 320px; }

  /* === ELEKTRONENKONFIGURATION (Übergangsmetalle) === */
  .econfig { text-align: center; padding: 0.3rem; }
  .econfig-full {
    font-family: "DM Mono", "SFMono-Regular", monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: #1c1712;
    margin-bottom: 0.7rem;
  }
  .orb-row {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .orb-shell { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
  .orb-label {
    font-family: "DM Mono", monospace;
    font-size: 0.85rem;
    font-weight: 700;
    color: #6b5bd2;
  }
  .orb-boxes { display: flex; gap: 2px; }
  .orb-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.35rem;
    height: 1.35rem;
    padding: 0 1px;
    border: 1.5px solid #1c1712;
    border-radius: 3px;
    font-size: 0.8rem;
    line-height: 1;
    letter-spacing: -1px;
    color: #1c1712;
    background: #fff;
  }

  /* === SPINNING WHEEL + AUFGABEN-SEITE (Punkt 0a / 0c) === */
  .task-page { animation: pageIn 0.28s ease; }
  @keyframes pageIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  .back-btn { margin-bottom: 0.9rem; }
  .spin-wheel {
    text-align: center;
    padding: 2.4rem 1rem;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0.8rem;
  }
  .spin-label { font-size: 0.95rem; color: var(--dim); letter-spacing: 0.02em; }
  .spin-name {
    font-size: 1.9rem;
    font-weight: 800;
    color: var(--accent, #7c6af7);
    background: linear-gradient(90deg,#7c6af7,#e96dbd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: spinPulse 0.16s ease;
    min-height: 2.3rem;
  }
  @keyframes spinPulse { from { transform: scale(0.9); opacity:0.5; } to { transform: scale(1); opacity:1; } }
  .subst-headline {
    text-align: center;
    margin: 0.4rem 0 0.6rem;
    padding: 0.7rem 1rem;
    background: linear-gradient(135deg, rgba(124,106,247,0.12), rgba(233,109,189,0.12));
    border-radius: 14px;
    border: 1px solid rgba(124,106,247,0.25);
  }
  .subst-name-de { font-size: 1.5rem; font-weight: 800; color: var(--text); }
  .subst-name-en { font-size: 0.95rem; color: var(--dim); font-style: italic; margin-top: 0.15rem; }

  /* === KONTEXT-INFO === */
  .context-box {
    margin-top: 1rem;
    background: rgba(124,106,247,0.06);
    border: 2px solid rgba(124,106,247,0.28);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.18s;
  }
  .context-box:hover:not(.revealed) {
    background: rgba(124,106,247,0.12);
    border-color: var(--accent);
  }
  .context-box.revealed {
    background: rgba(0,200,83,0.07);
    border-color: rgba(0,200,83,0.4);
    cursor: default;
  }
  .context-title {
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .context-hint {
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 0.25rem;
  }
  .context-text {
    font-size: 0.92rem;
    line-height: 1.45;
    color: var(--text);
    margin-top: 0.45rem;
  }

  /* === KOW-VERTIEFUNG (Oktanol-Wasser-Verteilungskoeffizient) === */
  .kow-box {
    margin-top: 0.7rem;
    background: rgba(0,170,220,0.06);
    border: 2px solid rgba(0,170,220,0.28);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.18s;
  }
  .kow-box:hover:not(.revealed) {
    background: rgba(0,170,220,0.12);
    border-color: #00aadc;
  }
  .kow-box.revealed {
    background: rgba(0,200,83,0.07);
    border-color: rgba(0,200,83,0.4);
    cursor: default;
  }
  .kow-title {
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .kow-hint {
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 0.25rem;
  }
  .kow-value {
    font-size: 1.02rem;
    font-weight: 700;
    color: #00aadc;
    margin-top: 0.45rem;
  }
  .kow-text {
    font-size: 0.92rem;
    line-height: 1.45;
    color: var(--text);
    margin-top: 0.35rem;
  }

  /* === SCORE BUTTONS === */
  .score-area {
    margin-top: 1rem;
    padding-top: 0.9rem;
    border-top: 1px dashed rgba(255,255,255,0.1);
  }
  .score-prompt {
    text-align: center;
    color: var(--dim);
    font-size: 0.82rem;
    margin-bottom: 0.6rem;
  }
  .score-btns {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .score-btn {
    background: var(--card2);
    border: 2px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 0.55rem 1.1rem;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.88rem;
