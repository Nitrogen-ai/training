 .intro{margin:12px 0 16px;padding:20px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(210,168,255,.08),rgba(88,166,255,.06));border:2px solid rgba(210,168,255,.3);animation:slideIn .3s ease}

<script>

// Item builders: gap (s with _ per gap, a = accepted answers, h = hint), choice, fix, order (chunks with |), bank ([gap] or [a/b])
const G=(s,a,h,x)=>({s,a:typeof a==="string"?[[a]]:(Array.isArray(a[0])?a:[a]),h,x});
const C=(s,o,a,x)=>({s,o,a,x});
const F=(w,r,m,x)=>({w,r:typeof r==="string"?[r]:r,m,x});
const O=(c,alt,x)=>({c,alt:alt||[],x});
const B=(t,x)=>({t,x});
const S=t=>`<span class="fp fp-subj">${t}</span>`,A=t=>`<span class="fp fp-aux">${t}</span>`,NO=t=>`<span class="fp fp-not">${t}</span>`,V=t=>`<span class="fp fp-verb">${t}</span>`,W=t=>`<span class="fp fp-wh">${t}</span>`,X=t=>`<span class="fp fp-plain">${t}</span>`,PL=`<span class="fp-plus">+</span>`,AR=`<span class="fp-arrow">→</span>`;
// ══════ DATA (Year 6 · Unit 2 · Let's buy something cool · Comparison of adjectives) ══════
const TITLE="📏 Comparison Trainer",TYPE_KEY="cmp6-types",INTRO_KEY="cmp6-intro";
const GOAL="🛍️ Unit 2 · Let's buy something cool · <em>I can compare things: cheaper, more expensive, the best, as cool as …</em>";
const COMP=[
  G("The blue cap is _ than the red one.",["cheaper"],"cheap"),

  G("My sister's room is _ than my room.",["tidier"],"tidy"),
  G("This game is _ than the old one.",["more exciting"],"exciting"),
  G("The red dress is _ than the green one.",["prettier"],"pretty"),
  G("Our new flat is _ than our old house.",["smaller"],"small"),
  G("Mr Patel's shop is _ than the big shopping centre.",["friendlier","more friendly"],"friendly"),
  G("This box is _ than that one.",["heavier"],"heavy"),
  G("The film was _ than the book.",["more interesting"],"interesting"),

];
const SUPER=[
  G("This is _ cap in the shop.",["the coolest"],"cool"),
  G("It's _ shop in Brighton.",["the biggest"],"big"),
  G("These are _ trainers in the shop.",["the most expensive"],"expensive"),
  G("That was _ day of my life!",["the best"],"good"),
  G("This is _ jumper in the whole shop.",["the ugliest"],"ugly"),
  G("Maya is _ girl in our class.",["the funniest"],"funny"),
  G("It was _ film of the year.",["the worst"],"bad"),
  G("This is _ shop in our street.",["the oldest"],"old"),
  G("Which is _ T-shirt?",["the cheapest"],"cheap"),
  G("This is _ ice cream in Brighton!",["the most delicious"],"delicious"),
  G("The sweet shop is _ shop for kids.",["the most popular"],"popular"),
  G("December is _ month for shops.",["the busiest"],"busy"),
  G("Ben is _ boy in the team.",["the tallest"],"tall"),
  G("This is _ T-shirt in the shop.",["the nicest"],"nice"),
  G("The pier is _ place in Brighton.",["the most exciting"],"exciting"),

const ASAS=[
  G("The blue cap is _ the red one. They both cost £10.",["as expensive as"],"expensive"),
  G("My trainers are _ yours. Yours are bigger.",["not as big as"],"not / big"),
  G("This shop is _ the one on North Street. Both are great.",["as good as"],"good"),
  G("The jeans are _ the jacket. The jacket is cheaper.",["not as cheap as"],"not / cheap"),
  G("Maya is _ her brother. They're both 1.50 m.",["as tall as"],"tall"),
  G("The film is _ the book. The book is more exciting.",["not as exciting as"],"not / exciting"),
  G("My bag is _ your bag. They're both very heavy.",["as heavy as"],"heavy"),
  G("This T-shirt is _ that one. That one is cooler.",["not as cool as"],"not / cool"),
  G("Today is _ yesterday. It was colder yesterday.",["not as cold as"],"not / cold"),
  G("Leo's room is _ my room. Mine is tidier.",["not as tidy as"],"not / tidy"),
  G("This cap is _ that one. They both look great.",["as nice as"],"nice"),
  G("The sweets are _ the chocolate. I love both!",["as delicious as"],"delicious")
];
const FORMS=[["cheap","cheaper","the cheapest"],["big","bigger","the biggest"],["nice","nicer","the nicest"],["happy","happier","the happiest"],
  ["expensive","more expensive","the most expensive"],["good","better","the best"],["bad","worse","the worst"],["hot","hotter","the hottest"],
  ["pretty","prettier","the prettiest"],["beautiful","more beautiful","the most beautiful"],["small","smaller","the smallest"],["busy","busier","the busiest"],
  ["interesting","more interesting","the most interesting"],["large","larger","the largest"],["funny","funnier","the funniest"],["thin","thinner","the thinnest"],
  ["long","longer","the longest"],["cool","cooler","the coolest"],["comfortable","more comfortable","the most comfortable"],["heavy","heavier","the heaviest"],
  ["sad","sadder","the saddest"],["easy","easier","the easiest"],["exciting","more exciting","the most exciting"],["new","newer","the newest"]

// ══════ DIAGNOSIS ══════
function DIAG(type,user,wants,it){
  const u=" "+norm(user)+" ",w=" "+norm(wants[0])+" ";
  if(/ more \w+er /.test(u)&&!/ more \w+er /.test(w)||/ more better | more worse /.test(u))return"Either <strong>-er</strong> or <strong>more</strong> – never both! (<em>bigger</em>, not <em>more bigger</em>)";
  if(/ most \w+est /.test(u)||/ most best | most worst /.test(u))return"Either <strong>-est</strong> or <strong>most</strong> – never both!";
  if(/ (gooder|goodest|badder|baddest|worser|worsest|bestest|more good|most good|more bad|most bad) /.test(u))return"Irregular! <strong>good → better → the best</strong> · <strong>bad → worse → the worst</strong>";
  if(w===" as "&&u!==" as ")return"Same or not the same → <strong>as … as</strong> / <strong>not as … as</strong>.";
  if(/ as \w+ than /.test(u)||(/ as /.test(w)&&!/ than /.test(w)&&/ than /.test(u)))return"<strong>as … as</strong> – never <em>as … than</em>!";
  if(/ then /.test(u)&&!/ then /.test(w))return"Comparisons use <strong>than</strong> (not <em>then</em>).";
  if(/ than /.test(w)&&/ as /.test(u)&&!/ as /.test(w))return"Comparative + <strong>than</strong>: <em>bigger than</em>, <em>more expensive than</em>.";
  if(/ as \w+ as /.test(w)&&/ (\w+er|more \w+) (than )?/.test(u)&&!/ as \w+ as /.test(u))return"Here you need <strong>as</strong> + normal adjective + <strong>as</strong> (no -er, no more).";
  if(/ not as /.test(w)&&!/ not /.test(u))return"They are <strong>not</strong> the same → <strong>not as … as</strong>.";
  if(/ as /.test(w)&&/ not /.test(u)&&!/ not /.test(w))return"Read again: they are <strong>the same</strong> → <strong>as … as</strong> (without not).";
  if(/ the (most |\w+est )/.test(w)&&/ (most |\w+est )/.test(u)&&!/ the (most |\w+est )/.test(u))return"A superlative needs <strong>the</strong>: <em>the biggest</em>, <em>the most expensive</em>.";
  if(/ more /.test(u)&&!/ more /.test(w)&&/ \w+er /.test(w))return"Short adjective → <strong>-er</strong> (cheap → cheaper), not <em>more</em>.";
  if(/ most /.test(u)&&!/ most /.test(w))return"Short adjective → <strong>the -est</strong> (cheap → the cheapest), not <em>most</em>.";
  if(/ more /.test(w)&&!/ more /.test(u)&&/ \w+er /.test(u))return"Long adjective → <strong>more</strong> + adjective (<em>more expensive</em>).";
  if(/ most /.test(w)&&!/ most /.test(u))return"Long adjective → <strong>the most</strong> + adjective (<em>the most expensive</em>).";
  if(/ (\w+est|best|worst) /.test(w)&&/ (\w+er|better|worse) /.test(u)&&!/ \w+est /.test(u))return"Number one of a group → <strong>superlative</strong>: <em>the …est</em> / <em>the most …</em>.";
  if(/ (\w+er|better|worse) /.test(w)&&/ (\w+est|best|worst) /.test(u))return"Two things → <strong>comparative</strong>: <em>-er</em> / <em>more</em> (+ than).";
  if(/ more /.test(w)&&/ the most /.test(u))return"Two things → <strong>more</strong> + adjective, not <em>the most</em>.";
  return null;
}

function ruleComp(){return`<div class="formula-title">📈 Comparative: two things</div>
  <div class="formula-rule">${S("short adjective")}${PL}${V("-er")}${PL}${W("than")}${X("·")}${A("more")}${PL}${S("long adjective")}${PL}${W("than")}</div>
  <div class="formula-example">${X("The blue cap is")}${V("cheaper")}${W("than")}${X("the red one.")}</div>
  <div class="formula-example">${X("The jacket is")}${A("more")}${V("expensive")}${W("than")}${X("the jumper.")}</div>`;}
function ruleSup(){return`<div class="formula-title">🏆 Superlative: number one of a group</div>
  <div class="formula-rule">${W("the")}${PL}${S("short adjective")}${PL}${V("-est")}${X("·")}${W("the")}${PL}${A("most")}${PL}${S("long adjective")}</div>
  <div class="formula-example">${X("It's")}${W("the")}${V("coolest")}${X("cap in the shop.")}</div>
  <div class="formula-example">${X("These are")}${W("the")}${A("most")}${V("expensive")}${X("trainers.")}</div>`;}
function ruleAsAs(){return`<div class="formula-title">⚖️ as … as: the same</div>
  <div class="formula-rule">${W("as")}${PL}${S("adjective")}${PL}${W("as")}${X("·")}${NO("not")}${W("as")}${PL}${S("adjective")}${PL}${W("as")}</div>
  <div class="formula-example">${X("This cap is")}${W("as")}${S("cool")}${W("as")}${X("that one.")}</div>
  <div class="formula-example">${X("My trainers are")}${A("not")}${W("as")}${S("big")}${W("as")}${X("yours.")}</div>
  <div class="spell">❌ <b>as cool than</b> · ❌ <b>as cooler as</b></div>`;}
function ruleIrr(){return`<div class="spell" style="margin-top:6px">⭐ Irregular: <b>good → better → the best</b> · <b>bad → worse → the worst</b></div>`;}
function ruleSpell(){return`<div class="spell">✏️ Spelling: big → <b>bigger</b>, hot → <b>hotter</b> (short vowel + consonant → double it) · nice → <b>nicer</b> (only -r) · happy → <b>happier</b>, busy → <b>the busiest</b> (y → i)<br>📏 Long = 3 syllables or more: ex-pen-sive, beau-ti-ful, in-ter-est-ing → <b>more / the most</b></div>`;}
function ruleTrap(){return`<div class="spell" style="margin-top:6px">⚠️ Never both: ❌ <b>more bigger</b> · ❌ <b>the most nicest</b></div>`;}
function ruleHTML(type){
  if(type==="comp")return ruleComp()+ruleIrr()+ruleSpell()+ruleTrap();
  if(type==="super")return ruleSup()+ruleIrr()+ruleSpell()+ruleTrap();
  if(type==="asas")return ruleAsAs();
  if(type==="forms")return ruleComp()+ruleSup()+ruleIrr()+ruleSpell();
  return ruleComp()+ruleSup()+ruleAsAs()+ruleIrr()+ruleSpell();
}

const CTR={"mustn't":"must not","needn't":"need not","shouldn't":"should not","couldn't":"could not","can't":"cannot","won't":"will not","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","it's":"it is","that's":"that is","there's":"there is","i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","what's":"what is"};
function norm(t){t=String(t).toLowerCase().replace(/[‘’′`´]/g,"'").replace(/[“”]/g,'"');for(const[c,e]of Object.entries(CTR))t=t.split(c).join(e);return t.replace(/[.,!?;:"()–—]/g," ").replace(/\bcan not\b/g,"cannot").replace(/\s+/g," ").trim();}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 99;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function isIn(user,list){const u=norm(user);return list.some(x=>norm(x)===u);}
function closest(user,list){const u=norm(user);let best=99;list.forEach(x=>{best=Math.min(best,lev(u,norm(x)));});return best;}
function bankParse(text){const gaps=[];const parts=[];let last=0;text.replace(/\[([^\]]+)\]/g,(m,inner,off)=>{parts.push(text.slice(last,off));gaps.push(inner.split("/"));parts.push(null);last=off+m.length;return m;});parts.push(text.slice(last));return{parts,gaps};}
function cap(s,first){return first?s.charAt(0).toUpperCase()+s.slice(1):s;}

function solutionHTML(type,it){
  const k=K(type);
  if(k==="gap"){const p=it.s.split("_");return p.map((x,i)=>esc(x)+(i<p.length-1?`<strong>${esc(cap(it.a[i][0],i===0&&!x.trim()))}</strong>`:"")).join("");}
  if(k==="choice"){const [a,b]=it.s.split("_");return`${esc(a)}<strong>${esc(cap(it.a,!a.trim()))}</strong>${esc(b)}`;}
  if(k==="bank"){const bp=bankParse(it.t);let g=0;return bp.parts.map(p=>p===null?`<strong>${esc(bp.gaps[g++][0])}</strong>`:esc(p)).join("");}
  if(k==="order")return`<strong>${esc(it.c.split("|").join(" "))}</strong>`;
  if(k==="fix")return`<strong>${esc(it.r[0])}</strong>`;
  return"";
}

// ══════ ROUNDS ══════
function spawnConfetti(gold){const c=document.createElement("div");c.className="confetti";document.body.appendChild(c);const cols=gold?["#e3b341","#ffa657","#ffd700","#fff5aa"]:["#58a6ff","#e3b341","#79c0ff","#3fb950","#d2a8ff","#f778ba"];for(let i=0;i<(gold?70:45);i++){const s=document.createElement("span");s.style.left=Math.random()*100+"%";s.style.background=pick(cols);const sz=(6+Math.random()*8)+"px";s.style.width=sz;s.style.height=sz;s.style.borderRadius=Math.random()>.5?"50%":"2px";s.style.animationDuration=(1.5+Math.random()*2)+"s";s.style.animationDelay=Math.random()*.5+"s";c.appendChild(s);}setTimeout(()=>c.remove(),4000);}
function spinWheelF(id,opts,forced,cb){state.spinning=true;document.querySelectorAll('.spin-btn').forEach(b=>b.classList.add('disabled'));const ct=document.getElementById(id);if(!ct){state.spinning=false;return;}const w=ct.querySelector('.wheel-window'),tr=ct.querySelector('.wheel-track');if(!w||!tr){state.spinning=false;return;}const ih=w.offsetHeight,wi=opts.indexOf(forced);if(wi<0){state.spinning=false;cb(forced);return;}const st=[];for(let c=0;c<2;c++)for(const o of opts)st.push(o);for(let i=0;i<=wi;i++)st.push(opts[i]);tr.innerHTML="";st.forEach(it=>{const d=document.createElement("div");d.className="wheel-item";d.textContent=it;tr.appendChild(d);});const fo=-(st.length-1)*ih;tr.style.transition="none";tr.style.transform="translateY(0)";requestAnimationFrame(()=>requestAnimationFrame(()=>{tr.style.transition="transform 0.8s cubic-bezier(0.08,0.82,0.17,1)";tr.style.transform=`translateY(${fo}px)`;}));setTimeout(()=>{state.spinning=false;cb(forced);},850);}
function spinnerHTML(id,opts){return `<div class="spinner-container" id="${id}"><button class="spin-btn ${state.spinning?'disabled':''}" onclick="doSpin('${id}')">🎰 Spin!</button><div class="wheel-window"><div class="wheel-pointer"></div><div class="wheel-track">${opts.map(o=>`<div class="wheel-item">${esc(o)}</div>`).join("")}</div></div></div>`;}
function setType(id){
  state.type=id;const t=typeById(id),it=pickTracked(t.pool,usedItems[id]);state.item=it;
  state.picked=[];state.fill=[];state.marks=[];state.chips=[];state.vals=[];state.wrongOpts=[];state.chosen=-1;state.lastInput="";
  if(t.kind==="gap"){state.vals=it.a.map(()=>"");state.marks=it.a.map(()=>"");}
  if(t.kind==="order"){const ch=it.c.split("|");let sh;do{sh=shuffle(ch.map((c,i)=>i));}while(ch.length>2&&sh.every((v,i)=>v===i));state.chips=sh.map(i=>ch[i]);}
  if(t.kind==="bank"){const bp=bankParse(it.t);state.chips=shuffle(bp.gaps.map(g=>g[0]));state.fill=bp.gaps.map(()=>null);state.marks=bp.gaps.map(()=>"");}
  if(t.kind==="choice")state.chips=shuffle(it.o);
}
function newRound(){
  state.step=0;state.playerName=null;state.type=null;state.item=null;
  state.attempts=0;state.feedback=null;state.revealed=false;state.spinning=false;state.ruleShown=false;
  state.b_noRule=true;state.b_firstTry=true;render();
}
window.doSpin=function(id){
  if(state.spinning)return;
  if(id==="spin-player"){const f=pickTracked(playerNames,usedNames);spinWheelF(id,playerNames,f,v=>{state.playerName=v;state.step=1;render();});}
  if(id==="spin-type"){const f=pickTracked(activeTypes,usedTypes);spinWheelF(id,activeTypes.map(labelOf),labelOf(f),()=>{setType(f);state.step=inputStep();render();});}
};
let introOpen=(function(){try{return localStorage.getItem(INTRO_KEY)!=="closed";}catch(e){return true;}})();
window.toggleIntro=function(){introOpen=!introOpen;try{localStorage.setItem(INTRO_KEY,introOpen?"open":"closed");}catch(e){}render();if(!introOpen)window.scrollTo({top:0,behavior:"smooth"});};
function wordCount(html){return html.replace(/<[^>]+>/g,"").trim().split(/\s+/).length;}
function introHTML(){
  if(!introOpen)return`<div class="intro-toggle"><button class="formula-btn" onclick="toggleIntro()">✨ ${INTRO_TITLE}</button></div>`;
  return`<div class="intro"><h2>✨ ${INTRO_TITLE}</h2>${INTRO_BODY()}<div class="btn-row"><button class="action-btn btn-next" onclick="toggleIntro()">🚀 Let's practise!</button></div></div>`;
}
window.showRule=function(){state.ruleShown=true;state.b_noRule=false;render();};

// ══════ TAP / TYPE INTERACTIONS ══════
window.tapChip=function(i){
  if(state.revealed)return;const k=K(state.type);
  if(k==="order"){if(!state.picked.includes(i))state.picked.push(i);}
  if(k==="bank"){if(state.fill.includes(i))return;const g=state.fill.indexOf(null);if(g<0)return;state.fill[g]=i;state.marks[g]="";}
  state.feedback=null;render();
};
window.untapOrder=function(pos){if(state.revealed)return;state.picked.splice(pos,1);state.feedback=null;render();};
window.untapGap=function(g){if(state.revealed||state.fill[g]===null)return;state.fill[g]=null;state.marks[g]="";state.feedback=null;render();};
window.clearBuild=function(){if(state.revealed)return;state.picked=[];if(K(state.type)==="bank"){state.fill=state.fill.map(()=>null);state.marks=state.marks.map(()=>"");}state.feedback=null;render();};
window.setVal=function(i,el){state.vals[i]=el.value;state.marks[i]="";el.classList.remove("wrong","right");};
window.gapKey=function(e,i){if(e.key!=="Enter")return;const n=document.getElementById("ans-"+(i+1));if(n&&!state.vals[i+1])n.focus();else checkAnswer();};
window.tapOpt=function(i){
  if(state.revealed||state.wrongOpts.includes(i))return;const it=state.item,o=state.chips[i];
  if(norm(o)===norm(it.a)){state.chosen=i;success();return;}
  state.wrongOpts.push(i);
  const hint=DIAG(state.type,o,[it.a],it)||(closest(o,[it.a])<=2?"Check the <strong>spelling</strong>! "+SPELL_HINT:"Read the whole sentence again – what does it mean?");
  if(state.wrongOpts.length>=state.chips.length-1){state.b_firstTry=false;state.streak=0;state.chosen=state.chips.findIndex(c=>norm(c)===norm(it.a));revealNow(`${pick(EMOJIS_W)} <small>${hint}</small><br>📖 The correct answer:`);return;}
  failure(hint);
};

// ══════ CHECK ══════
function readInput(){const i=document.getElementById("answer-input");return i?i.value.trim():"";}
function success(){
  const bd=[];let bp=0;
  if(state.b_noRule){bp++;bd.push("+1 no rule");}
  if(state.b_firstTry){bp++;bd.push("+1 first try");}
  state.score+=1+bp;state.bonusTotal+=bp;state.streak++;if(state.streak>state.highStreak)state.highStreak=state.streak;
  if(K(state.type)==="gap")state.marks=state.marks.map(()=>"right");
  const nm=state.playerName?` Well done, ${esc(state.playerName)}!`:"";
  const bl=bp>0?`<br><small>⭐ ${bd.join(" · ")} = <strong>${1+bp} pts</strong></small>`:`<br><small>+1 pt</small>`;
  const ex=explainHTML(state.type,state.item);
  state.feedback={type:"correct",msg:`${pick(EMOJIS_C)} Correct!${nm}${bl}<br><small>✅ ${solutionHTML(state.type,state.item)}</small>${ex?`<br><small>${ex}</small>`:""}`};
  state.revealed=true;spawnConfetti(bp>=2);render();
}
function failure(hint){
  state.b_firstTry=false;state.attempts++;
  if(state.attempts>=3){state.streak=0;revealNow("📖 The correct answer:");return;}
  state.feedback={type:"wrong",msg:`${pick(EMOJIS_W)} Not quite!${hint?`<br><small>💡 ${hint}</small>`:""}<br><small>Try again! (${state.attempts}/3)</small>`};
  render();
}
function revealNow(lead){
  const k=K(state.type);
  if(k==="bank")state.marks=state.marks.map(()=>"");
  if(k==="choice")state.chosen=state.chips.findIndex(c=>norm(c)===norm(state.item.a));
  const ex=explainHTML(state.type,state.item);
  state.feedback={type:"reveal",msg:`${lead} ${solutionHTML(state.type,state.item)}${ex?`<br><small>${ex}</small>`:""}<br><small>You'll get it next time! 💪</small>`};
  state.revealed=true;render();
}
function startsWith(w){return`Starts with: <strong>${esc(w.slice(0,Math.max(1,Math.ceil(w.length/3))))}</strong> …`;}
window.checkAnswer=function(){
  if(state.revealed)return;const type=state.type,it=state.item,k=K(type),t=typeById(type);
  if(k==="choice")return;
  if(k==="order"){
    if(state.picked.length<state.chips.length){state.feedback={type:"wrong",msg:"🧩 Use all the words first!"};render();return;}
    const ua=state.picked.map(i=>state.chips[i]).join(" ");
    if(isIn(ua,[it.c.split("|").join(" "),...it.alt])){success();return;}
    const ch=it.c.split("|"),okStart=ch.findIndex((c,j)=>norm(state.chips[state.picked[j]]||"")!==norm(c));
    failure(state.attempts===0?ORDER_HINT:`${okStart>0?`The first ${okStart} part(s) are right. `:""}Starts with: <strong>${esc(ch.slice(0,Math.max(okStart,0)+1).join(" "))}</strong> …`);return;
  }
  if(k==="bank"){
    if(state.fill.includes(null)){state.feedback={type:"wrong",msg:"🧺 Fill all the gaps first!"};render();return;}
    const bp=bankParse(it.t);let wrong=0;
    state.marks=bp.gaps.map((g,j)=>{const w=state.chips[state.fill[j]];const ok=g.includes(w);if(!ok)wrong++;return ok?"right":"wrong";});
    if(!wrong){success();return;}
    failure(`${wrong} gap(s) are wrong (pink). Tap them to take the word back.<br>${BANK_HINT}`);return;
  }
  if(k==="gap"){
    const vals=state.vals.map(v=>(v||"").trim());
    if(vals.some(v=>!v)){state.feedback={type:"wrong",msg:"✍️ Fill in all the gaps first!"};render();return;}
    let fw=-1;state.marks=it.a.map((acc,j)=>{const ok=isIn(vals[j],acc);if(!ok&&fw<0)fw=j;return ok?"right":"wrong";});
    if(fw<0){success();return;}
    const acc=it.a[fw],uv=vals[fw];
    let hint=DIAG(type,uv,acc,it);
    if(!hint&&closest(uv,acc)<=2)hint="Almost! Check your <strong>spelling</strong>. "+SPELL_HINT;
    if(!hint)hint=state.attempts===0?(t.hint||"Read the sentence again."):startsWith(acc[0]);
    if(it.a.length>1)hint=`The pink gap isn't right yet. `+hint;
    failure(hint);return;
  }
  const ua=readInput();if(!ua)return;state.lastInput=ua;
  if(isIn(ua,it.r)){success();return;}
  let hint=null;
  if(norm(ua)===norm(it.w))hint="That's the same sentence – find the mistake and change it!";
  if(!hint)hint=DIAG(type,ua,it.r,it);
  if(!hint&&closest(ua,it.r)<=2)hint="Almost! Check your <strong>spelling</strong> and punctuation.";
  if(!hint)hint=state.attempts===0?"One part of the sentence is wrong. Find it and correct it.":`Look at <strong>${esc(it.m)}</strong>.`;
  failure(hint);
};
window.skipRound=function(){state.streak=0;revealNow("⏭️ Answer:");};

// ══════ RENDER ══════
function taskHTML(){
  const t=typeById(state.type),it=state.item,k=t.kind,lock=state.revealed?"disabled":"";
  let h=`<div class="task-box"><div class="task-instr">${t.instr}</div>`;
  if(k==="gap"){
    const p=it.s.split("_");
    h+=`<div class="task-line">`+p.map((x,i)=>{let s=x.trim()?`<span>${esc(x.trim())}</span>`:"";if(i<p.length-1){const sz=Math.max(7,...it.a[i].map(a=>a.length+2));s+=`<input class="inline-input ${state.marks[i]}" id="ans-${i}" size="${sz}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(state.vals[i]||"")}" ${lock} oninput="setVal(${i},this)" onkeydown="gapKey(event,${i})">`;if(i===0&&it.h&&t.inline)s+=`<span class="adj-hint">(${esc(it.h)})</span>`;}return s;}).join("")+`</div>`;
    if(it.h&&!t.inline)h+=`<div class="sit">💬 ${esc(it.h)}</div>`;
  }else if(k==="choice"){
    const [a,b]=it.s.split("_"),c=state.chosen>=0?state.chips[state.chosen]:"";
    h+=`<div class="task-line"><span>${esc(a)}<span class="gapshow${c?" right":""}">${c?esc(cap(c,!a.trim())):"&nbsp;?&nbsp;"}</span>${esc(b)}</span></div>`;
    h+=`<div class="chip-tray">${state.chips.map((o,i)=>`<span class="chip${state.wrongOpts.includes(i)?" wrong":""}${i===state.chosen?" right":""}" onclick="tapOpt(${i})">${esc(cap(o,!a.trim()))}</span>`).join("")}</div>`;
  }else if(k==="fix"){
    h+=`<div class="task-src">${esc(it.w)}</div>`;
    h+=`<div class="input-area"><input type="text" id="answer-input" autocomplete="off" spellcheck="false" placeholder="Write the correct sentence here…" value="${esc(state.lastInput)}" ${lock} onkeydown="if(event.key==='Enter')checkAnswer()"/></div>`;
  }else if(k==="order"){
    h+=`<div class="build-line">${state.picked.length?state.picked.map((ci,pos)=>`<span class="chip" onclick="untapOrder(${pos})">${esc(state.chips[ci])}</span>`).join(""):`<span class="placeholder">Tap the words below in the right order …</span>`}</div>`;
    h+=`<div class="chip-tray">${state.chips.map((c,i)=>`<span class="chip${state.picked.includes(i)?" used":""}" onclick="tapChip(${i})">${esc(c)}</span>`).join("")}</div>`;
  }else if(k==="bank"){
    const bp=bankParse(it.t);let g=0;const next=state.fill.indexOf(null);
    h+=`<div class="story">`+bp.parts.map(p=>{if(p!==null)return esc(p).replace(/\n/g,"<br>");const j=g++;const f=state.fill[j];const cls=["gap",f!==null?"filled":"",j===next&&!state.revealed?"next":"",state.marks[j]].join(" ");return`<span class="${cls}" onclick="untapGap(${j})">${f!==null?esc(state.chips[f]):"&nbsp;"}</span>`;}).join("")+`</div>`;
    h+=`<div class="chip-tray">${state.chips.map((c,i)=>`<span class="chip${state.fill.includes(i)?" used":""}" onclick="tapChip(${i})">${esc(c)}</span>`).join("")}</div>`;
  }
  if(!state.revealed){const bA=(state.b_noRule?1:0)+(state.b_firstTry?1:0);h+=`<div style="text-align:center"><span class="bonus-indicator">⭐ Up to +${bA} bonus pts available</span></div>`;}
  return h+`</div>`;
}
function render(){
  if(activeTypes.length===1&&!state.type&&state.step===(hasNames()?1:0)){setType(activeTypes[0]);state.step++;}
  const app=document.getElementById("app"),HN=hasNames(),IS=inputStep(),TS=totalSteps();
  const ti=TITLE.split(" ");let h=`<h1><span style="-webkit-text-fill-color:initial">${ti[0]}</span> ${ti.slice(1).join(" ")} <span style="font-size:.55em;opacity:.6">Year 6</span></h1><div class="goal">${GOAL}</div>`;
  h+=introHTML();
  h+=`<div class="csv-area"><div class="csv-row">`;
  if(!HN)h+=`<span class="csv-label">📋 Optional: load student names</span><button class="csv-btn" onclick="triggerCSV()">📂 Upload .CSV</button>`;
  else h+=`<span class="csv-info">👥 ${playerNames.length} names (${Math.max(0,playerNames.length-usedNames.length+1)} left)</span><span class="csv-clear" onclick="clearNames()">✕ clear</span>`;
  h+=`</div>`;if(HN){h+=`<div class="tracker csv-names-list">`;playerNames.forEach(n=>{const ic=state.playerName===n,iu=usedNames.includes(n)&&!ic;h+=`<span class="tracker-pill${iu?' used':''}${ic?' current':''}">${esc(n)}</span> `;});h+=`</div>`;}h+=`</div>`;
  h+=`<div class="stats-bar"><div class="stat">🏆 Score: <strong>${state.score}</strong></div><div class="stat"><span class="${state.streak>=3?'streak-fire':''}">🔥</span> Streak: <strong>${state.streak}</strong></div><div class="stat">📈 Highest: <strong>${state.highStreak}</strong></div><div class="stat stat-bonus">⭐ Extra: <strong>${state.bonusTotal}</strong></div></div>`;
  h+=`<div class="progress-ring"><div class="step-dots">`;for(let i=0;i<TS;i++)h+=`<div class="step-dot ${i<state.step?"done":i===state.step?"active":""}"></div>`;h+=`</div></div>`;
  if(HN){h+=`<div class="section"><div class="section-title">🙋 Player</div>`;if(state.playerName)h+=`<div class="done-badge">🎰 ${esc(state.playerName)} ✅</div>`;else if(state.step===0)h+=spinnerHTML("spin-player",playerNames);else h+=`<div class="waiting-badge">⏳</div>`;h+=`</div>`;}
  const ts=HN?1:0;h+=`<div class="section"><div class="section-title">🎯 Task type</div>`;
  if(state.type)h+=`<div class="done-badge">${activeTypes.length===1?"📌":"🎰"} ${labelOf(state.type)} ✅</div>`;else if(state.step===ts)h+=spinnerHTML("spin-type",activeTypes.map(labelOf));else h+=`<div class="waiting-badge">⏳</div>`;
  h+=`<div class="tracker">`;TYPES.forEach(t=>{const on=activeTypes.includes(t.id),ic=state.type===t.id,iu=on&&usedTypes.includes(t.id)&&!ic;h+=`<span class="tracker-pill type-pill${on?'':' off'}${iu?' used':''}${ic?' current':''}" onclick="toggleType('${t.id}')" title="${on?'click to leave out':'click to practise'}">${t.label}</span> `;});
  h+=`</div><div class="type-hint">Click the task types you want to practise${activeTypes.length<TYPES.length?` · <a onclick="allTypes()">all types</a>`:''}</div></div>`;
  if(state.step>=IS&&state.item){
    const k=K(state.type);
    if(state.playerName)h+=`<div class="section-title">✍️ <span style="color:var(--pink)">${esc(state.playerName)}</span>, it's your turn!</div>`;
    h+=taskHTML();
    if(!state.revealed){
      if(!state.ruleShown)h+=`<div style="text-align:center;margin:8px 0"><button class="formula-btn" onclick="showRule()">📐 Show the rule <small style="opacity:.6">(−1 bonus)</small></button></div>`;
      else h+=`<div class="formula-box">${ruleHTML(state.type)}</div>`;
      if(k==="order"||k==="bank")h+=`<p class="hint">Tap a word to place it · tap it again to take it back · <a style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="clearBuild()">start again</a></p>`;
      else if(k==="choice")h+=`<p class="hint">👆 Tap the word that fits.</p>`;
      else h+=`<p class="hint">💡 Capital letters and full stops don't matter.</p>`;
      h+=`<div class="btn-row">${k==="choice"?"":`<button class="action-btn btn-check" onclick="checkAnswer()">✅ Check</button>`}<button class="action-btn btn-skip" onclick="skipRound()">⏭️ Skip</button></div>`;
    }
    if(state.feedback)h+=`<div class="feedback ${state.feedback.type}">${state.feedback.msg}</div>`;
    if(state.revealed)h+=`<div class="btn-row"><button class="action-btn btn-next" onclick="newRound()">🎲 Next task</button></div>`;
  }
  app.innerHTML=h;
  if(state.step>=IS&&!state.revealed)setTimeout(()=>{let i=document.getElementById("answer-input");if(!i){const k=state.marks.findIndex(m=>m==="wrong");i=document.getElementById("ans-"+(k>=0?k:Math.max(0,state.vals.findIndex(v=>!v))));}if(i&&document.activeElement!==i){i.focus();const l=i.value.length;try{i.setSelectionRange(l,l);}catch(e){}}},60);
}
newRound();
</script>
</body>
</html>
